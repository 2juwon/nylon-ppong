    sh.querySelector('[data-close]').onclick = () => { if (fromRound) showRoundSheet(); else { closeSheet(); resume(); } };
  }
  function showGameEnd(refresh) {
    if (!G) return;
    clearTimers();
    const first = shownFor !== endKey();
    shownFor = endKey();
    const st = NP.standings(G);
    const mine = st.find((r) => r.i === HUMAN);
    const title = mine.rank === 1 ? (st.filter((r) => r.rank === 1).length > 1 ? '공동 1등!' : '1등!') : `${mine.rank}등`;
    if (first && !refresh) { if (mine.rank === 1) celebrate(true); else Sound.lose(); }
    const isHost = online && online.room && online.room.host === online.seat;
    const actions = online
      ? `<div class="sheet-actions">
          <button class="btn" type="button" data-leave>나가기</button>
          ${isHost ? '<button class="btn primary" type="button" data-again data-autofocus>한 번 더</button>' : ''}
        </div><p class="live">${isHost ? '‘한 번 더’를 누르면 지금 사람들과 같은 방 대기실로 가요.' : '방장이 ‘한 번 더’를 누르면 같은 방 대기실로 가요.'}</p>`
      : `<div class="sheet-actions">
          <button class="btn" type="button" data-settings>설정 바꾸기</button>
          <button class="btn primary" type="button" data-again data-autofocus>한 번 더</button>
        </div>`;
    let rec = null, recNote = '';
    if (mine.rank === 1 && SERVER) {
      rec = currentRecord();
      const pend = loadJSON(RECORD_KEY, null);
      if (rec && pend && pend.ticket === rec.ticket) rec = pend;
      if (rec) {
        if (recordUI.key !== rec.ticket) recordUI = { key: rec.ticket, name: '', done: null, msg: '' };
        if (!recordUI.done) saveJSON(RECORD_KEY, rec);
      } else recNote = whyNoRecord();
    }
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">${mine.rank === 1 ? '壹' : '終'}</span><div><h2 id="sheetTitle">${title}</h2><p class="lede">${G.rounds}판을 모두 마쳤어요. 누적 점수가 가장 낮은 사람이 이겨요.</p></div></div>
      <ol class="rank-list">${st.map((r) => `<li class="${r.rank === 1 ? 'first' : ''}"><span class="rk">${r.rank}위</span>${avatarHTML(r.i)}<b>${esc(r.name)}</b><span class="pts">${r.score}점</span></li>`).join('')}</ol>
      ${rec ? recordBoxHTML(rec) : recNote ? `<p class="live">${esc(recNote)}</p>` : ''}
      ${scoreTableHTML()}
      ${actions}
      ${SERVER ? '<div class="sheet-actions" style="margin-top:6px"><button class="btn" type="button" data-ranking>랭킹 보기</button></div>' : ''}`, { dismiss: false, kind: 'end', noFocus: !!refresh || !!rec });
    if (rec) bindRecordBox(sh, rec, () => showGameEnd(true));
    const rkb = sh.querySelector('[data-ranking]');
    if (rkb) rkb.onclick = () => showRanking({ board: `${G.rounds}-4`, back: () => showGameEnd(true) });
    const again = sh.querySelector('[data-again]');
    if (again) again.onclick = () => {
      if (online) { Net.send({ t: 'again' }); again.disabled = true; return; }
      closeSheet();
      newGame();
    };
    const set = sh.querySelector('[data-settings]');
    if (set) set.onclick = () => showStart();
    const lv = sh.querySelector('[data-leave]');
    if (lv) lv.onclick = () => leaveOnline();
  }

  /* ───────── 사람들과 하기 (온라인) ───────── */
  const NAME_KEY = 'nylonppong.name';
  const PID_KEY = 'nylonppong.pid';
  const cleanNick = (s) => Array.from(String(s || '').replace(/[\u0000-\u001f\u007f<>&"']/g, '').replace(/\s+/g, ' ').trim()).slice(0, 8).join('');
  function myName() { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } }
  function setMyName(n) { try { if (n) localStorage.setItem(NAME_KEY, n); } catch (e) { /* 무시 */ } }
  function randomHex(bytes) { const a = new Uint8Array(bytes); crypto.getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); }
  // 다시 들어올 때 같은 자리를 찾는 열쇠 (이 브라우저에만 저장)
  function getPid() {
    try {
      let p = localStorage.getItem(PID_KEY);
      if (!/^[a-f0-9]{32}$/.test(p || '')) { p = randomHex(16); localStorage.setItem(PID_KEY, p); }
      return p;
    } catch (e) { return randomHex(16); }
  }

  const Net = (() => {
    let ws = null, code = null, want = false, tries = 0, gotState = false, ping = null, pid = null, queued = 0;
    let chain = Promise.resolve();
    async function api(path, body) {
      const r = await fetch(SERVER + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error || !j.code) throw new Error(j.error || 'http ' + r.status);
      return j;
    }
    async function stats() { const r = await fetch(SERVER + '/api/stats'); return r.json(); }
    function connect() {
      if (!want || !code) return;
      pid = pid || getPid();
      const url = SERVER.replace(/^http/, 'ws') + `/ws/${code}?pid=${pid}&name=${encodeURIComponent(myName() || '손님')}`;
      let sock;
      try { sock = new WebSocket(url); } catch (e) { retry(); return; }
      ws = sock;
      sock.onopen = () => {
        tries = 0;
        clearInterval(ping);
        ping = setInterval(() => { if (sock.readyState === 1) sock.send('ping'); }, 25000);
      };
      sock.onmessage = (e) => {
        if (e.data === 'pong' || sock !== ws) return;
        let m;
        try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.t === 'state') gotState = true;
        queued++;
        chain = chain.then(() => onNet(m)).catch((err) => console.error(err)).finally(() => { queued = Math.max(0, queued - 1); });
      };
      sock.onclose = () => {
        clearInterval(ping);
        if (sock === ws) { ws = null; retry(); }
      };
    }
    function retry() {
      if (!want) return;
      tries++;
      if (!gotState && tries >= 4) {
        want = false;
        chain = chain.then(() => exitOnline('서버에 연결하지 못했어요. 잠시 뒤에 다시 해 주세요'));
        return;
      }
      if (gotState) say('연결이 끊겼어요. 다시 연결하는 중이에요…');
      setTimeout(connect, Math.min(8000, 400 * 2 ** Math.min(tries, 5)));
    }
    return {
      api, stats,
      get pending() { return queued; },
      open(c) {
        code = c; want = true; tries = 0; gotState = false;
        if (ws) { const old = ws; ws = null; try { old.close(1000); } catch (e) { /* 무시 */ } }
        connect();
      },
      send(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; },
      close() {
        want = false; code = null; clearInterval(ping);
        const s = ws; ws = null;
        if (s) { try { s.close(1000); } catch (e) { /* 무시 */ } }
      },
      wake() { if (want && !ws) { tries = 0; connect(); } },
    };
  })();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Net.wake(); });

  // 서버가 보낸 판을 '내가 0번(아래쪽)'이 되게 돌려서, 혼자 할 때 화면을 그대로 씀
  function rotator(me, n) {
    const R = (i) => (typeof i !== 'number' || i < 0 ? i : (i - me + n) % n);
    const rot = (arr) => (Array.isArray(arr) ? arr.map((_, k) => arr[(k + me) % n]) : arr);
    return { R, rot };
  }
  function rotateResult(res, R, rot) {
    if (!res) return null;
    return {
      ...res, p: R(res.p), from: R(res.from), best: R(res.best), nextDealer: R(res.nextDealer),
      totals: rot(res.totals), scores: rot(res.scores), notes: rot(res.notes), hands: rot(res.hands), melds: rot(res.melds), cumulative: rot(res.cumulative),
    };
  }
  function rotateView(v, me, room) {
    const n = v.players.length;
    const { R, rot } = rotator(me, n);
    const players = rot(v.players).map((p, k) => {
      const abs = (k + me) % n;
      const si = room.seats[abs] || null;
      return {
        name: k === 0 ? '나' : p.name, kind: si && si.kind === 'ai' ? 'ai' : 'human', persona: p.persona,
        hand: Array.isArray(p.hand) ? p.hand.slice() : new Array(p.handCount).fill(-1),
        melds: p.melds, score: p.score, drawsSinceMeld: p.drawsSinceMeld, abs, seatInfo: si,
      };
    });
    let claim = null;
    if (v.claim) claim = v.claim.pending ? { pending: true, from: R(v.claim.from), card: v.claim.card } : { ...v.claim, p: R(v.claim.p), from: R(v.claim.from) };
    return {
      v: 1, online: true, rules: v.rules, rounds: v.rounds, round: v.round, dealer: R(v.dealer), turn: R(v.turn), phase: v.phase, step: v.step,
      claim, deck: new Array(v.deckCount).fill(-1), pile: v.pile.map((e) => ({ ...e, by: R(e.by) })), players,
      result: rotateResult(v.result, R, rot),
      history: (v.history || []).map((h) => ({ ...h, p: R(h.p), scores: rot(h.scores) })),
    };
  }
  function rotateLast(last, me, n) {
    const { R, rot } = rotator(me, n);
    const fix = (o) => { const c = { ...o }; ['p', 'from', 'dealer'].forEach((k) => { if (typeof c[k] === 'number') c[k] = R(c[k]); }); return c; };
    return {
      step: last.step,
      action: fix(last.action),
      events: last.events.map((e) => (e.t === 'roundEnd' ? { ...fix(e), result: rotateResult(e.result, R, rot) } : fix(e))),
    };
  }

  let quickRetries = 0;
  async function onNet(m) {
    if (!online) return;
    if (m.t === 'error') {
      if (m.fatal) {
        if (m.code === 'full' && online.quick && quickRetries < 2) {
          quickRetries++;
          try { const r = await Net.api('/api/quick'); joinRoom(r.code, { quick: true, keepRetries: true }); return; } catch (e) { /* 아래로 */ }
        }
        exitOnline(m.message || '방에 들어가지 못했어요');
        return;
      }
      clearTimeout(actGuard);
      busy = false;
      say(esc(m.message || '그 행동은 지금 할 수 없어요'));
      render();
      return;
    }
    if (m.t !== 'state') return;
    const room = m.room;
    online.room = room;
    online.seat = m.seat;
    online.rankTicket = m.rankTicket || null;
    online.skew = (m.now || Date.now()) - Date.now();
    if (m.seat < 0) { exitOnline('방에서 내 자리가 없어졌어요'); return; }
    if (room.status === 'waiting' || !m.view) {
      clearTimeout(actGuard);
      busy = false;
      if (!preview) showPreview();
      online.gen = room.gen;
      showWaiting();
      return;
    }
    quickRetries = 0;
    const n = m.view.players.length;
    const next = rotateView(m.view, m.seat, room);
    const last = m.last ? rotateLast(m.last, m.seat, n) : null;
    const fresh = online.gen !== room.gen;
    const sequential = G && !preview && !fresh && last && G.step === m.view.step - 1;
    const dealt = last && last.action.type === 'start' && m.view.step === 0;
    const animate = (sequential || dealt) && Net.pending <= 2 && !document.hidden && T(100) > 0;
    online.gen = room.gen;
    if (fresh) { shownFor = null; selected = null; }
    const newRound = last && (last.action.type === 'next' || last.action.type === 'start');
    if (sheetKind === 'waiting' || sheetKind === 'connecting' || sheetKind === 'invited' ||
      (sheetKind === 'round' && next.phase !== 'roundEnd') || (sheetKind === 'end' && next.phase !== 'gameEnd') ||
      (sheetKind === 'scores' && newRound)) closeSheet();
    clearTimeout(actGuard);
    if (animate) {
      const from = snapshotFrom(last.action, last.events);
      preview = false;
      G = next;
      busy = true;
      try { await present(last.action, last.events, from); } catch (e) { console.error(e); }
      busy = false;
    } else {
      preview = false;
      G = next;
      busy = false;
      if (last && last.action.type === 'discard') battleOpenAt = Date.now();
    }
    if (selected != null && !G.players[HUMAN].hand.includes(selected)) selected = null;
    render();
    onlineAfter();
  }

  function onlineAfter() {
    if (!online || !G || preview) return;
    if (G.phase === 'roundEnd') {
      const key = resultKey();
      if (shownFor !== key) later(() => { if (online && G && G.phase === 'roundEnd' && shownFor !== key && !sheetKind) showRoundSheet(); }, Math.max(500, T(700)));
      else if (sheetKind === 'round') showRoundSheet(true);
      return;
    }
    if (G.phase === 'gameEnd') {
      if (shownFor !== endKey()) showGameEnd(); else if (sheetKind === 'end' && !(document.activeElement && document.activeElement.id === 'recName')) showGameEnd(true);
      return;
    }
    if (NP.actorOf(G) === HUMAN && G.phase === 'draw') {
      say(NP.canStop(G, HUMAN) ? '내 차례 — 한 장 가져오거나 <em>스톱</em>할 수 있어요' : '내 차례 — 더미에서 한 장 가져오세요');
    }
  }

  function joinRoom(code, opts = {}) {
    if (!opts.keepRetries) quickRetries = 0;
    online = { code, seat: -1, room: null, skew: 0, gen: -1, quick: !!opts.quick };
    clearTimers();
    busy = false;
    selected = null;
    shownFor = null;
    showPreview();
    try { history.replaceState(null, '', '#' + code); } catch (e) { /* 무시 */ }
    const sh = openSheet(`<div class="sheet-head"><span class="seal-mark" aria-hidden="true">房</span><div><h2 id="sheetTitle">방 ${code.slice(0, 3)} ${code.slice(3)}</h2><p class="lede">들어가는 중이에요…</p></div></div>
      <div class="sheet-actions"><button class="btn" type="button" data-cancel>그만두기</button></div>`, { kind: 'connecting', dismiss: false });
    sh.querySelector('[data-cancel]').onclick = () => leaveOnline();
    Net.open(code);
  }
  function exitOnline(message) {
    Net.close();
    online = null;
    busy = false;
    clearTimeout(actGuard);
    clearTimers();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 무시 */ }
    showPreview();
    showStart(message);
  }
  function leaveOnline() {
    Net.send({ t: 'leave' });
    exitOnline();
  }

  function rulesSummary(r) {
    const d = NP.DEFAULT_RULES, out = [];
    if (r.battle) out.push('전투모드');
    if (r.stopLimit !== d.stopLimit) out.push(`스톱 ${r.stopLimit} 이하`);
    if (r.stopPenalty !== d.stopPenalty) out.push(`스톱 실패 +${r.stopPenalty}`);
    if (r.bagaji !== d.bagaji) out.push(`바가지 +${r.bagaji}`);
    if (r.chongtongStrict) out.push('총통 4-2만');
    if (r.jayeon42 === false) out.push('4-2는 일반 뽕');
    if (r.naturalFree !== d.naturalFree) out.push(r.naturalFree ? '자연뽕 빼 줌' : '자연뽕 그대로 셈');
    return out.length ? ' · ' + out.join(', ') : '';
  }
  function showWaiting() {
    const r = online && online.room;
    if (!r) return;
    const me = online.seat, isHost = r.host === me, st = r.settings;
    const humans = r.seats.filter((s) => s.kind === 'human').length;
    const list = r.seats.map((s, i) => {
      if (s.kind !== 'human') return '<li><span class="slot" aria-hidden="true"></span><span class="empty">빈자리 · 시작하면 컴퓨터가 앉아요</span></li>';
      const av = `<span class="avatar" style="--av:${i === me ? 'var(--seal)' : AVS[i % AVS.length]}" aria-hidden="true">${esc(Array.from(s.name)[0] || '?')}</span>`;
      return `<li>${av}<span class="who-name">${esc(s.name)}</span>${i === r.host ? '<span class="tag host">방장</span>' : ''}${i === me ? '<span class="tag me">나</span>' : ''}${s.online ? '' : '<span class="tag off">끊김</span>'}</li>`;
    }).join('');
    const settings = isHost
      ? `<div class="field"><span class="field-label">인원</span>${seg('w-max', [[2, '2명'], [3, '3명'], [4, '4명']], st.max)}</div>
        <div class="field"><span class="field-label">판 수</span>${seg('w-rounds', [[3, '3판'], [5, '5판'], [10, '10판']], st.rounds)}</div>
        <div class="field"><span class="field-label">누가 들어올 수 있나요</span>${seg('w-public', [['no', '번호 아는 사람만'], ['yes', '빠른 참가에도 열기']], st.public ? 'yes' : 'no')}</div>
        ${gameModeHTML(st.rules)}
        ${houseRulesHTML(st.rules)}`
      : `<p class="live">${st.max}명 · ${st.rounds}판 · ${st.public ? '공개 방' : '친구 방'}${rulesSummary(st.rules)}</p>`;
    const wasOpen = sheetKind === 'waiting' && !!document.querySelector('#sheet details.house[open]');
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">房</span><div><h2 id="sheetTitle">대기실</h2><p class="lede">${isHost ? '사람이 모이면 시작하세요. 빈자리는 컴퓨터가 채워요.' : '방장이 시작하면 바로 판이 열려요.'}</p></div></div>
      <div class="code-box"><div><span class="code-label">방 번호</span><b class="code">${r.code.slice(0, 3)} ${r.code.slice(3)}</b></div><button class="btn" type="button" data-invite>초대하기</button></div>
      <p class="copied" data-copied></p>
      <ol class="seat-list">${list}</ol>
      ${settings}
      <div class="sheet-actions">
        <button class="btn" type="button" data-leave>나가기</button>
        ${isHost ? '<button class="btn primary" type="button" data-start>시작하기</button>' : ''}
      </div>`, { kind: 'waiting', dismiss: false, noFocus: sheetKind === 'waiting' });
    if (wasOpen) { const d = sh.querySelector('details.house'); if (d) d.open = true; }
    sh.querySelector('[data-invite]').onclick = () => invite(sh);
    sh.querySelector('[data-leave]').onclick = () => leaveOnline();
    const startBtn = sh.querySelector('[data-start]');
    if (startBtn) startBtn.onclick = () => { Sound.unlock(); if (Net.send({ t: 'start' })) startBtn.disabled = true; };
    if (isHost) {
      const val = (name) => { const i = sh.querySelector(`input[name="${name}"]:checked`); return i ? i.value : null; };
      sh.querySelectorAll('input[type="radio"]').forEach((i) => i.addEventListener('change', () => {
        Net.send({ t: 'settings', settings: { max: +val('w-max'), rounds: +val('w-rounds'), public: val('w-public') === 'yes', rules: readRules(sh) } });
      }));
    }
  }

  async function invite(sh) {
    const url = location.origin + location.pathname + '#' + online.code;
    const text = `나일롱뽕 같이 해요! 방 번호 ${online.code}`;
    const note = (t) => { const n = sh && sh.querySelector('[data-copied]'); if (n) n.textContent = t; };
    if (navigator.share) {
      try { await navigator.share({ title: '나일롱뽕', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(`${text}\n${url}`); note('초대 링크를 복사했어요. 카톡 같은 데 붙여 넣으세요'); } catch (e) { note(url); }
  }

  function showOnlineMenu() {
    const r = online.room;
    const playing = r && r.status === 'playing';
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">房</span><div><h2 id="sheetTitle">방 ${online.code.slice(0, 3)} ${online.code.slice(3)}</h2><p class="lede">${playing ? '게임 중에 나가면 내 자리는 컴퓨터가 대신 둬요.' : '사람들과 하는 중이에요.'}</p></div></div>
      <div class="sheet-actions"><button class="btn" type="button" data-invite>친구 초대하기</button><button class="btn" type="button" data-rules>규칙 보기</button></div>
      <p class="copied" data-copied></p>
      <div class="sheet-actions"><button class="btn" type="button" data-ranking>랭킹</button><button class="btn" type="button" data-feedback>의견 보내기</button></div>
      <div class="sheet-actions"><button class="btn" type="button" data-leave>방 나가기</button><button class="btn primary" type="button" data-close data-autofocus>돌아가기</button></div>`, { kind: 'menu' });
    sh.querySelector('[data-invite]').onclick = () => invite(sh);
    sh.querySelector('[data-rules]').onclick = () => {
      const s2 = openSheet(rulesHTML(), { kind: 'rules' });
      s2.querySelector('[data-close]').onclick = () => { closeSheet(); resume(); };
    };
    sh.querySelector('[data-leave]').onclick = () => leaveOnline();
    sh.querySelector('[data-close]').onclick = () => { closeSheet(); resume(); };
    sh.querySelector('[data-feedback]').onclick = () => showFeedback(() => showOnlineMenu());
    sh.querySelector('[data-ranking]').onclick = () => showRanking({ back: () => showOnlineMenu() });
  }

  /* ───────── 랭킹 ───────── */
  const RECORD_KEY = 'nylonppong.record';   // 아직 등록 안 한 1등 기록
  const MINE_KEY = 'nylonppong.myranks';    // 내가 올린 기록 id (랭킹에서 내 줄 표시)
  const isDefaultRules = (r) => !!r && Object.keys(NP.DEFAULT_RULES).every((k) => r[k] === NP.DEFAULT_RULES[k]);
  // 혼자 하기 시작할 때 서버에서 씨앗을 받아 둠. 서버가 늦거나 지역 규칙을 바꾸면 랭킹 없이 그냥 시작
  let staleBuild = false;
  async function rankTicket() {
    if (!SERVER || !isDefaultRules(S.rules) || S.cpu !== 3) return null; // 랭킹은 4명(컴퓨터 3명)일 때만
    try {
      const ctl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = setTimeout(() => ctl && ctl.abort(), 2500);
      const r = await fetch(SERVER + '/api/rank/ticket', { method: 'POST', signal: ctl ? ctl.signal : undefined });
      clearTimeout(timer);
      const j = await r.json();
      if (j && j.ticket && j.rv !== NP.RULES_VERSION) { staleBuild = true; return null; } // 서버가 더 새 버전 → 이 화면으론 랭킹 못 올림
      return j && j.ticket && j.seed ? { ticket: j.ticket, seed: j.seed >>> 0 } : null;
    } catch (e) { return null; }
  }
  const loadJSON = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
  const saveJSON = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 무시 */ } };
  let recordUI = { key: null, name: '', done: null, msg: '' };
  // 방금 끝난 게임의 등록할 수 있는 기록 (1등일 때만)
  function currentRecord() {
    if (!G || G.phase !== 'gameEnd') return null;
    const mine = NP.standings(G).find((r) => r.i === HUMAN);
    if (mine.rank !== 1) return null;
    const n = G.players.length;
    if (n !== 4) return null;
    if (online) return online.rankTicket ? { ticket: online.rankTicket, mode: 'online', score: mine.score, rounds: G.rounds, n, at: Date.now() } : null;
    if (!G.rank) return null;
    return { ticket: G.rank.ticket, mode: 'solo', score: mine.score, rounds: G.rounds, n, cpu: n - 1, log: G.rank.log.slice(), at: Date.now() };
  }
  function whyNoRecord() {
    if (!SERVER || !G) return '';
    if (G.players.length !== 4) return '랭킹은 4명이서 한 게임만 올라가요.';
    if (G.rules.battle) return '전투모드 게임은 아직 랭킹에 올릴 수 없어요.';
    if (!isDefaultRules(G.rules)) return '지역 규칙을 바꾼 게임은 랭킹에 올릴 수 없어요.';
    if (!online && !G.rank && staleBuild) return '게임이 새 버전으로 바뀌었어요. 새로고침하면 다음 게임부터 랭킹에 올릴 수 있어요.';
    if (!online && !G.rank) return '서버에 연결되지 않은 채 시작한 게임이라 랭킹에 올릴 수 없어요.';
    return '';
  }
  const boardLabel = (rec) => `${rec.rounds}판`;
  function recordBoxHTML(rec) {
    if (recordUI.done && recordUI.key === rec.ticket) {
      const d = recordUI.done;
      return `<div class="record-box"><div class="rec-label">RANKING · ${boardLabel(rec)}</div>
        <p class="rec-done">${d.place ? `${esc(recordUI.name)} · ${d.place}위에 올랐어요!` : '등록했어요! (100위 밖)'}</p>
        <div class="sheet-actions" style="justify-content:center"><button class="btn primary" type="button" data-see-rank>랭킹 보기</button></div></div>`;
    }
    return `<div class="record-box"><div class="rec-label">NEW RECORD · ${boardLabel(rec)}</div>
      <div class="rec-score">${rec.score}점</div>
      <p class="rec-sub">1등 기념으로 랭킹에 이름을 남겨요. 모두가 볼 수 있어요.</p>
      <div class="join-row"><input class="text-input" id="recName" maxlength="8" autocomplete="nickname" placeholder="이름 (8자까지)" value="${esc(recordUI.name || myName())}"><button class="btn primary" type="button" data-rec-send>등록</button></div>
      <p class="rec-msg" data-rec-msg${recordUI.msg ? '' : ' hidden'}>${esc(recordUI.msg)}</p></div>`;
  }
  // 등록 상자 동작 연결 (끝난 화면·랭킹 화면 공용). after(): 다시 그리기
  function bindRecordBox(sh, rec, after) {
    const see = sh.querySelector('[data-see-rank]');
    if (see) see.onclick = () => showRanking({ board: `${rec.rounds}-${rec.n}`, back: after });
    const input = sh.querySelector('#recName'), send = sh.querySelector('[data-rec-send]');
    if (!input || !send) return;
    input.addEventListener('input', () => { recordUI.name = input.value; });
    const go = async () => {
      const name = cleanNick(input.value);
      const msg = sh.querySelector('[data-rec-msg]');
      if (!name) { msg.textContent = '이름을 넣어 주세요'; msg.hidden = false; input.focus(); return; }
      send.disabled = true;
      try {
        const body = { ticket: rec.ticket, name };
        if (rec.mode === 'solo') Object.assign(body, { cpu: rec.cpu, rounds: rec.rounds, log: rec.log, score: rec.score, rv: NP.RULES_VERSION });
        const r = await fetch(SERVER + '/api/rank/submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j.error || '등록하지 못했어요');
        recordUI = { key: rec.ticket, name, done: j, msg: '' };
        setMyName(name);
        saveJSON(MINE_KEY, loadJSON(MINE_KEY, []).concat(j.id).slice(-50));
        saveJSON(RECORD_KEY, null);
        Sound.tak();
      } catch (e) {
        recordUI.key = rec.ticket; recordUI.name = input.value;
        recordUI.msg = e.message && /[가-힣]/.test(e.message) ? e.message : '등록하지 못했어요. 잠시 뒤에 다시 해 주세요';
        if (/이미 등록|오래된|새로고침/.test(recordUI.msg)) saveJSON(RECORD_KEY, null); // 다시 눌러도 안 되는 기록은 남겨 두지 않음
      }
      after();
    };
    send.onclick = go;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  }
  function showRanking(opts = {}) {
    const pend = loadJSON(RECORD_KEY, null);
    const st = { board: opts.board || `${pend ? pend.rounds : S.rounds}-4` };
    if (recordUI.key !== (pend && pend.ticket)) recordUI = { key: pend && pend.ticket, name: '', done: null, msg: '' };
    const [r0] = st.board.split('-');
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">榜</span><div><h2 id="sheetTitle">랭킹</h2><p class="lede">4명이서 1등 한 게임의 최종 점수예요. 낮을수록 위, 같은 점수면 먼저 올린 사람이 위.</p></div></div>
      ${pend && !(recordUI.done) ? recordBoxHTML(pend) : ''}
      <div class="field"><span class="field-label">판 수</span>${seg('rk-rounds', [[3, '3판'], [5, '5판'], [10, '10판']], +r0)}</div>
      <div data-board><p class="board-empty">불러오는 중…</p></div>
      <div class="sheet-actions"><button class="btn primary" type="button" data-close data-autofocus>${opts.back ? '돌아가기' : '닫기'}</button></div>`, { kind: 'ranking' });
    if (pend && !recordUI.done) bindRecordBox(sh, pend, () => showRanking(opts));
    sh.querySelector('[data-close]').onclick = () => { if (opts.back) opts.back(); else { closeSheet(); resume(); } };
    const mine = new Set(loadJSON(MINE_KEY, []));
    let seq = 0;
    const load = async () => {
      const r = (sh.querySelector('input[name="rk-rounds"]:checked') || {}).value, n = 4;
      const key = `${r}-${n}`, my = ++seq, box = sh.querySelector('[data-board]');
      opts.board = key;
      box.innerHTML = '<p class="board-empty">불러오는 중…</p>';
      try {
        const res = await fetch(SERVER + '/api/rank?board=' + key);
        const j = await res.json();
        if (my !== seq) return;
        if (!res.ok || !Array.isArray(j.list)) throw new Error();
        box.innerHTML = j.list.length
          ? `<ol class="board">${j.list.map((e, i) => `<li class="${mine.has(e.id) ? 'mine' : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(e.name)}</span><span class="md">${e.mode === 'online' ? '사람들과' : '컴퓨터와'} · ${new Date(e.at).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' })}</span><span class="pts">${e.score}</span></li>`).join('')}</ol>`
          : `<p class="board-empty">${r}판 랭킹은 아직 비어 있어요.<br>1등 하고 첫 이름을 올려 보세요!</p>`;
      } catch (e) {
        if (my === seq) box.innerHTML = '<p class="board-empty">랭킹을 불러오지 못했어요. 잠시 뒤에 다시 열어 주세요.</p>';
      }
    };
    sh.querySelectorAll('input[name="rk-rounds"]').forEach((i) => i.addEventListener('change', load));
    load();
  }

  /* ───────── 의견·고장 신고 ───────── */
  function feedbackContext() {
    const c = { build: BUILD, mode: online ? 'online' : 'solo', screen: `${innerWidth}x${innerHeight}`, recent: recent.slice(-15) };
    if (online) { c.room = online.code; c.seat = online.seat; c.status = online.room && online.room.status; }
    if (G && !preview) {
      c.game = {
        round: G.round, rounds: G.rounds, phase: G.phase, step: G.step, turn: G.turn, dealer: G.dealer, rules: G.rules,
        myHand: G.players[0].hand, myMelds: G.players[0].melds, handCounts: G.players.map((p) => p.hand.length),
        scores: G.players.map((p) => p.score), pileTop: G.pile.slice(-6), deck: G.deck.length, claim: G.claim, history: G.history,
      };
      if (!online) c.fullState = G; // 혼자 할 때는 판 전체를 보내서 그대로 다시 재현
    }
    try { if (JSON.stringify(c).length > 15000) delete c.fullState; } catch (e) { delete c.fullState; }
    return c;
  }
  function showFeedback(back) {
    const inGame = !!(G && !preview);
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">書</span><div><h2 id="sheetTitle">의견 보내기</h2><p class="lede">고장 난 곳이나 바라는 점을 알려 주세요. 만든 사람만 읽어요.</p></div></div>
      <div class="field">${seg('fb-kind', [['bug', '고장 신고'], ['idea', '의견']], inGame ? 'bug' : 'idea')}</div>
      <div class="field"><label class="field-label" for="fbText">내용</label><textarea class="text-input" id="fbText" maxlength="2000" placeholder="예: 뽕하고 3장 남았는데 판이 안 끝나요"></textarea></div>
      <div class="field"><label class="field-label" for="fbContact">답을 받고 싶으면 연락처 (선택)</label><input class="text-input" id="fbContact" maxlength="100" placeholder="이메일이나 카톡 아이디"></div>
      ${inGame ? '<label class="check"><input type="checkbox" id="fbCtx" checked><span>지금 게임 상황도 같이 보내기<br>내 손패와 최근 진행 기록이 들어가요. 고장 원인을 찾는 데 큰 도움이 돼요.</span></label>' : ''}
      <p class="notice" data-notice hidden></p>
      <div class="sheet-actions"><button class="btn" type="button" data-back>돌아가기</button><button class="btn primary" type="button" data-send>보내기</button></div>`, { kind: 'feedback' });
    const note = (t, ok) => { const n = sh.querySelector('[data-notice]'); n.textContent = t; n.hidden = !t; n.style.background = ok ? 'rgba(143,194,122,.25)' : ''; n.style.color = ok ? 'var(--ink)' : ''; };
    sh.querySelector('[data-back]').onclick = back;
    const send = sh.querySelector('[data-send]');
    send.onclick = async () => {
      const text = sh.querySelector('#fbText').value.trim();
      if (!text) { note('내용을 적어 주세요'); sh.querySelector('#fbText').focus(); return; }
      const kind = (sh.querySelector('input[name="fb-kind"]:checked') || {}).value || 'idea';
      const ctxBox = sh.querySelector('#fbCtx');
      send.disabled = true;
      note('');
      try {
        const r = await fetch(SERVER + '/api/feedback', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ kind, text, contact: sh.querySelector('#fbContact').value, context: ctxBox && ctxBox.checked ? feedbackContext() : { build: BUILD, mode: online ? 'online' : 'solo' } }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.error) throw new Error(j.error || '보내지 못했어요');
        sh.querySelector('#fbText').value = '';
        note('보냈어요. 고마워요!', true);
        send.textContent = '보냄';
      } catch (e) {
        note(e.message && /[가-힣]/.test(e.message) ? e.message : '보내지 못했어요. 잠시 뒤에 다시 해 주세요');
        send.disabled = false;
      }
    };
  }

  function showInvited(code) {
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">뽕</span><div><h2 id="sheetTitle">나일롱뽕 초대</h2><p class="lede">방 ${code.slice(0, 3)} ${code.slice(3)}에서 같이 하자고 해요.</p></div></div>
      <div class="field"><label class="field-label" for="nick">닉네임</label><input class="text-input" id="nick" maxlength="8" autocomplete="nickname" placeholder="예: 주원" value="${esc(myName())}"></div>
      <p class="notice" data-notice hidden></p>
      <div class="sheet-actions"><button class="btn" type="button" data-solo>혼자 하기</button><button class="btn primary" type="button" data-go>들어가기</button></div>`, { kind: 'invited', dismiss: false });
    const nick = sh.querySelector('#nick');
    const go = () => {
      const name = cleanNick(nick.value);
      if (!name) { const n = sh.querySelector('[data-notice]'); n.textContent = '닉네임을 정해 주세요. 다른 사람에게 이 이름으로 보여요'; n.hidden = false; nick.focus(); return; }
      setMyName(name);
      Sound.unlock();
      joinRoom(code);
    };
    sh.querySelector('[data-go]').onclick = go;
    nick.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    sh.querySelector('[data-solo]').onclick = () => {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 무시 */ }
      startMode = 'solo';
      showStart();
    };
  }

  function tickClock() {
    if (!online || !online.room) return;
    const d = online.room.deadline;
    const left = d ? Math.max(0, Math.ceil((d - (Date.now() + online.skew)) / 1000)) : 0;
    document.querySelectorAll('[data-clock]').forEach((n) => { n.textContent = d ? `${left}초` : ''; });
  }
  setInterval(tickClock, 250);
  window.addEventListener('hashchange', () => {
    const m = /^#(\d{6})$/.exec(location.hash || '');
    if (!m || !SERVER || (online && online.code === m[1])) return;
    if (online) Net.send({ t: 'leave' });
    if (myName()) joinRoom(m[1]); else showInvited(m[1]);
  });

  /* ───────── 시작 ───────── */
  function randomSeed() {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] || 1; } catch (e) { return (Math.random() * 4294967295) >>> 0 || 1; }
  }
  function makeGame(seed) {
    const players = [{ name: ME.name, kind: 'human' }];
    for (let k = 0; k < S.cpu; k++) players.push({ name: CPU[k].name, kind: 'ai', persona: CPU[k].persona });
    return NP.createGame({ players, rounds: S.rounds, rules: S.rules, seed, firstDealer: HUMAN });
  }
  async function newGame() {
    clearTimers();
    gen += 1;
    const g0 = gen;
    busy = true;
    preview = false;
    selected = null;
    shownFor = null;
    const tk = await rankTicket();
    if (gen !== g0) return;
    if (staleBuild) say('새 버전이 나왔어요. 새로고침하면 랭킹에 올릴 수 있어요');
    G = makeGame(tk ? tk.seed : randomSeed());
    G.rank = tk ? { ticket: tk.ticket, log: [] } : null;
    saveStore();
    try { await dealAnimation(); } finally { if (gen === g0) busy = false; }
    if (gen !== g0) return;
    render();
    saveStore();
    tick();
  }
  function showPreview() {
    preview = true;
    G = makeGame(20261013);
    render();
    say('');
  }

  $('#btnRules').onclick = showRules;
  $('#btnScores').onclick = () => (G && !preview ? showScores(false) : showRules());
  $('#btnMenu').onclick = () => (online ? showOnlineMenu() : showStart());
  $('#btnSound').onclick = () => {
    Sound.on = !Sound.on;
    $('#btnSound').setAttribute('aria-pressed', String(Sound.on));
    if (Sound.on) { Sound.unlock(); Sound.tak(); }
    saveStore();
  };
  $('#deck').onclick = () => {
    if (!G || preview || G.phase !== 'draw' || G.turn !== HUMAN) return;
    if (drawHoldLeft(G.claim && G.claim.open && G.claim.p === HUMAN) > 0) return; // 전투모드: 뽕 누를 틈
    act({ type: 'draw', p: HUMAN });
  };

  function boot(data) {
    buildSprite();
    const store = loadStore();
    S = cleanSettings((data && data.S) || store.settings);
    if (typeof store.sound === 'boolean') Sound.on = store.sound;
    if (data && typeof data.sound === 'boolean') Sound.on = data.sound;
    $('#btnSound').setAttribute('aria-pressed', String(Sound.on));
    if (store.mode === 'solo' || store.mode === 'online') startMode = store.mode;
    // 초대 링크(#방번호)로 들어왔거나, 사람들과 하다가 새로고침한 경우
    const invited = /^#(\d{6})$/.exec(location.hash || '');
    if (invited && SERVER) {
      showPreview();
      if (myName()) joinRoom(invited[1]); else showInvited(invited[1]);
      return;
    }
    const saved = (data && validGame(data.G) && !data.G.online && data.G) || (validGame(store.game) && store.game);
    if (saved && saved.phase !== 'gameEnd') {
      G = saved;
      preview = false;
      render();
      say(lastLine || '이어서 할 수 있어요');
      if (data && data.G) { tick(); return; }
      showStart();
      return;
    }
    showPreview();
    showStart();
  }

  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ G: preview || online ? null : G, S, sound: Sound.on })); } catch (e) { /* 미리보기 밖 */ }
  }
  // 자동 테스트용 손잡이
  window.__nylon = { get G() { return G; }, act, get busy() { return busy; }, newGame, setSpeed(v) { S.speed = v; }, get online() { return online; }, get sheet() { return sheetKind; }, party: (big) => celebrate(!!big) };

  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
