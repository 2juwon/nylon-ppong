<title>나일롱뽕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면짜리 화투판 — 위에 상대 자리, 가운데 담요 위 더미·버림패, 아래 내 손패. 결과는 종이 점수표가 올라옴 */
:root {
  --blanket: #474e35;        /* 국방색 담요 */
  --blanket-deep: #363c29;
  --blanket-lift: rgba(16, 18, 9, 0.30);
  --stitch: rgba(196, 188, 128, 0.42);
  --ink: #1c1913;            /* 먹 */
  --hanji: #f1e7cf;          /* 화투 앞면·점수표 종이 */
  --hanji-shade: #ddcfae;
  --hanji-line: rgba(28, 25, 19, 0.12);
  --seal: #c3321f;           /* 인주 · 화투 뒷면 */
  --seal-deep: #8d2014;
  --brass: #e2b24e;          /* 선 표시 · 차례 */
  --brass-glow: rgba(226, 178, 78, 0.38);
  --text: #f3ecd9;
  --text-dim: #c4bf9f;
  --text-faint: rgba(243, 236, 217, 0.34);
  --scrim: rgba(17, 15, 9, 0.66);
  --av-1: #2f6c64;
  --av-2: #7e3d5c;
  --av-3: #9a6a25;
  --av-4: #4f5f86;
  --good: #8fc27a;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", system-ui, sans-serif;
  --hand-w: clamp(44px, min(calc((min(100vw, 760px) - 62px) / 6), 9.6vh), 78px);
  --pile-w: clamp(54px, min(20vw, 10.6vh), 96px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  word-break: keep-all;
  overflow-wrap: break-word;
  background-color: var(--blanket);
  background-image:
    radial-gradient(120% 70% at 50% 46%, rgba(255, 250, 215, 0.07), transparent 62%),
    repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.06) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 5px);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.app {
  height: 100%;
  min-height: 560px;
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── 위 막대 ── */
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px 0; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.seal-mark {
  flex: none; width: 28px; height: 28px; border-radius: 6px;
  display: grid; place-items: center;
  background: var(--seal); color: var(--hanji);
  font: 15px/1 var(--font-display);
  box-shadow: inset 0 0 0 2px var(--seal), inset 0 0 0 3.5px var(--hanji);
  transform: rotate(-6deg);
}
.brand h1 { margin: 0; font: 22px/1 var(--font-display); letter-spacing: 0.02em; white-space: nowrap; }
.brand-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.round-chip { font-size: 12px; line-height: 1.1; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 4px; flex: none; }
.tool {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08);
  background: var(--blanket-lift); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.tool svg { width: 19px; height: 19px; stroke: var(--text); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="false"] .on, .tool[aria-pressed="true"] .off { display: none; }
.tool:hover { background: rgba(16, 18, 9, 0.45); }

/* ── 상대 자리 ── */
.seats { display: grid; grid-template-columns: repeat(var(--opp, 3), minmax(0, 1fr)); gap: 8px; }
.seat {
  position: relative; min-width: 0;
  background: var(--blanket-lift);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 12px; padding: 8px 8px 7px;
  display: grid; gap: 6px; align-content: start;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.seat.turn { border-color: var(--brass); box-shadow: 0 0 0 3px var(--brass-glow); }
.who { display: flex; align-items: center; gap: 6px; min-width: 0; }
.avatar {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  font: 12px/1 var(--font-display); color: var(--hanji); background: var(--av);
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.18);
}
.who .name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sun {
  flex: none; font: 10px/1 var(--font-display); color: var(--ink); background: var(--brass);
  padding: 3px 4px 2px; border-radius: 3px; transform: rotate(-4deg);
}
.seat-score { font: 14px/1 var(--font-display); color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.seat-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 24px; }
.minis { display: flex; align-items: center; min-height: 22px; }
.mini {
  width: 14px; height: 22px; border-radius: 2.5px;
  background: var(--seal);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(0, 0, 0, 0.14);
}
.mini + .mini { margin-left: -7px; }
.out-tag { font-size: 11px; color: var(--brass); }
.melds { display: flex; gap: 4px; flex-wrap: wrap; }
.meld { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-dim); }
.meld .card { --w: 20px; }
.thinking { position: absolute; right: 8px; bottom: 7px; display: flex; gap: 3px; }
.thinking i { width: 4px; height: 4px; border-radius: 50%; background: var(--brass); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: 0.15s; }
.thinking i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 100% { opacity: 0.25 } 50% { opacity: 1 } }

/* ── 담요 가운데 ── */
.felt {
  flex: 1; min-height: 0;
  border: 2px dashed var(--stitch); border-radius: 22px;
  display: flex; flex-direction: column; justify-content: center; gap: 12px;
  padding: 12px 10px;
}
.center { display: flex; align-items: flex-start; justify-content: center; gap: clamp(28px, 10vw, 72px); }
.stack { display: grid; justify-items: center; gap: 6px; }
.stack-label { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-height: 15px; text-align: center; }
.deck, .pile { position: relative; width: var(--pile-w); height: calc(var(--pile-w) * 1.6); }
.deck { cursor: default; border: 0; padding: 0; background: none; }
.deck .card, .pile .card { --w: var(--pile-w); position: absolute; left: 0; top: 0; }
.deck.can { cursor: pointer; }
.deck.can::after {
  content: ""; position: absolute; inset: -6px; border-radius: 12px;
  border: 2px solid var(--brass); animation: pulse 1.3s ease-in-out infinite;
}
.pile.claimable::after {
  content: ""; position: absolute; inset: -6px; border-radius: 12px;
  border: 2px solid var(--seal); box-shadow: 0 0 18px rgba(195, 50, 31, 0.6);
  animation: pulse 0.9s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(0.98) } 50% { opacity: 1; transform: scale(1.02) } }
.pile-empty { position: absolute; inset: 0; border-radius: 8px; border: 1.5px dashed var(--stitch); }

.tracker { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; max-width: 520px; width: 100%; margin: 0 auto; }
.tk { display: grid; justify-items: center; gap: 3px; padding: 4px 0 5px; border-radius: 6px; background: rgba(16, 18, 9, 0.22); }
.tk b { font: 11px/1 var(--font-display); color: var(--text-dim); font-variant-numeric: tabular-nums; }
.tk.dead b { color: var(--text-faint); }
.pips { display: grid; grid-template-columns: repeat(2, 5px); gap: 2px; }
.pip { width: 5px; height: 5px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--text-faint); }
.pip.seen { background: var(--text-dim); box-shadow: none; }
.pip.mine { background: var(--seal); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3); }
.tracker-cap { display: flex; justify-content: center; gap: 12px; font-size: 11px; color: var(--text-dim); }
.tracker-cap span { display: inline-flex; align-items: center; gap: 4px; }
.tracker-cap .pip { display: inline-block; }

.msg { margin: 0; min-height: 20px; text-align: center; font-size: 14px; font-weight: 500; color: var(--text); text-wrap: balance; }
.msg em { font-style: normal; color: var(--brass); }

/* ── 내 자리 ── */
.me { display: grid; gap: 8px; padding-block: 0 12px; }
.me-head { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.me-head .stat { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.me-head .stat b { font: 16px/1 var(--font-display); color: var(--text); margin-left: 3px; }
.me-head .stat + .stat { margin-left: auto; }
.me.turn .avatar { box-shadow: 0 0 0 3px var(--brass-glow), inset 0 0 0 1.5px rgba(255, 255, 255, 0.2); }
.hand {
  display: flex; justify-content: center; align-items: flex-end; gap: 6px;
  min-height: calc(var(--hand-w) * 1.6 + 14px); padding-top: 14px;
}
.hand .card { cursor: default; transition: transform 0.16s ease, box-shadow 0.16s ease; }
.hand.pick .card { cursor: pointer; }
.hand.pick .card:hover { transform: translateY(-5px); }
.hand .card.sel { transform: translateY(-14px); box-shadow: 0 0 0 2.5px var(--brass), 0 10px 18px rgba(0, 0, 0, 0.45); }
.hand .card.match { box-shadow: 0 0 0 2.5px var(--seal), 0 6px 14px rgba(0, 0, 0, 0.4); transform: translateY(-6px); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; min-height: 48px; }
.hint { font-size: 13px; color: var(--text-dim); text-align: center; }

.btn {
  border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
  background: var(--blanket-deep); color: var(--text);
  padding: 12px 18px; min-height: 46px;
  font: 700 15px/1.1 var(--font-ui); cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--seal); border-color: var(--seal-deep); color: var(--hanji); box-shadow: 0 3px 0 var(--seal-deep); }
.btn.gold { background: var(--brass); border-color: #a7802f; color: var(--ink); box-shadow: 0 3px 0 #9a7428; }
.btn.shout { font: 22px/1 var(--font-display); padding: 10px 26px; letter-spacing: 0.04em; }
.btn small { font: 500 12px/1 var(--font-ui); opacity: 0.85; }

/* ── 화투패 ── */
.card {
  --w: var(--hand-w);
  position: relative; flex: none;
  width: var(--w); height: calc(var(--w) * 1.6);
  border-radius: calc(var(--w) * 0.1);
  background: var(--hanji);
  border: 0; padding: 0; margin: 0;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.42), 0 3px 6px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  overflow: hidden;
}
.card svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .n {
  position: absolute; left: 7%; top: 4.5%;
  min-width: calc(var(--w) * 0.3); height: calc(var(--w) * 0.3);
  padding: 0 calc(var(--w) * 0.05);
  display: grid; place-items: center;
  background: var(--ink); color: var(--hanji);
  font: calc(var(--w) * 0.21)/1 var(--font-display);
  border-radius: calc(var(--w) * 0.07);
  box-shadow: 0 0 0 calc(var(--w) * 0.025) var(--hanji);
  font-variant-numeric: tabular-nums;
}
.card.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.16) 0 18%, transparent 19%),
    var(--seal);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 3px 6px rgba(0, 0, 0, 0.32), inset 0 0 0 calc(var(--w) * 0.07) rgba(0, 0, 0, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.25);
}
.card.incoming { visibility: hidden; }
.ghost { position: fixed; z-index: 40; transform-origin: 0 0; pointer-events: none; margin: 0; }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; }
#party { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }

/* ── 도장(뽕·박·스톱) ── */
.stamp {
  position: fixed; z-index: 70; pointer-events: none;
  translate: -50% -50%;
  padding: 10px 16px 8px; border-radius: 10px;
  background: var(--seal); color: var(--hanji);
  font: 38px/1 var(--font-display); letter-spacing: 0.04em; white-space: nowrap;
  box-shadow: inset 0 0 0 3px var(--seal), inset 0 0 0 5.5px var(--hanji), 0 10px 26px rgba(0, 0, 0, 0.45);
  animation: stampIn 0.42s cubic-bezier(.2, 1.4, .4, 1) both;
}
.stamp small { display: block; margin-top: 5px; font: 700 12px/1.2 var(--font-ui); letter-spacing: 0; text-align: center; }
.stamp.out { animation: stampOut 0.35s ease-in both; }
@keyframes stampIn { 0% { transform: rotate(-9deg) scale(2.3); opacity: 0 } 60% { transform: rotate(-9deg) scale(0.94); opacity: 1 } 100% { transform: rotate(-9deg) scale(1); opacity: 1 } }
@keyframes stampOut { to { transform: rotate(-9deg) scale(1.08); opacity: 0 } }

/* ── 종이 시트 ── */
.backdrop {
  position: fixed; inset: 0; z-index: 80;
  background: var(--scrim);
  display: grid; align-items: end; justify-items: center;
  padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-top: calc(16px + env(safe-area-inset-top, 0px));
}
.sheet {
  width: min(560px, 100%); max-height: 100%; overflow: auto;
  background: var(--hanji); color: var(--ink);
  border-radius: 16px; padding: 20px 18px 18px;
  box-shadow: 0 -6px 40px rgba(0, 0, 0, 0.45);
  animation: rise 0.28s cubic-bezier(.2, .8, .2, 1) both;
  overscroll-behavior: contain;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0 } }
@media (min-width: 700px) { .backdrop { align-items: center; } }
.sheet h2 { margin: 0; font: 26px/1.15 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.sheet h3 { margin: 18px 0 6px; font: 16px/1.2 var(--font-display); letter-spacing: 0.01em; }
.sheet p { margin: 6px 0 0; line-height: 1.6; }
.sheet .lede { color: #4a4437; }
.sheet-head { display: flex; gap: 12px; align-items: center; }
.sheet .seal-mark { width: 44px; height: 44px; font-size: 22px; border-radius: 9px; }
.sheet .btn { box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); }
.sheet .btn:not(.primary):not(.gold) { background: transparent; color: var(--ink); border-color: rgba(28, 25, 19, 0.3); }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.sheet-actions .btn { flex: 1 1 140px; }

.field { margin-top: 14px; }
.field-label { display: block; font-size: 12px; font-weight: 700; color: #5a5242; margin-bottom: 6px; letter-spacing: 0.02em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border-radius: 10px;
  border: 1.5px solid rgba(28, 25, 19, 0.22); font-weight: 500; font-size: 14px; background: rgba(255, 255, 255, 0.35);
}
.seg input:checked + span { background: var(--ink); color: var(--hanji); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--seal); outline-offset: 2px; }
details.house { margin-top: 16px; border-top: 1px solid var(--hanji-line); padding-top: 10px; }
details.house summary { cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.house summary::-webkit-details-marker { display: none; }
details.house summary::before { content: "＋"; font-weight: 700; color: var(--seal); }
details.house[open] summary::before { content: "－"; }
details.house .note { font-size: 12px; color: #6a6250; margin-top: 4px; }

/* 결과 점수표 */
.tally { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1.5px solid var(--ink); }
.tally li {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "who round total" "cards cards sum";
  align-items: center; column-gap: 14px; row-gap: 6px; padding: 10px 2px;
  border-bottom: 1px solid var(--hanji-line);
}
.tally li.win { background: linear-gradient(90deg, rgba(226, 178, 78, 0.28), transparent 75%); }
.tally .who { grid-area: who; }
.tally .who .name { font-size: 15px; }
.tally .note { font-size: 11px; font-weight: 700; color: var(--seal); white-space: nowrap; }
.tally .cards { grid-area: cards; display: flex; gap: 3px; flex-wrap: wrap; align-items: center; min-width: 0; }
.tally .cards .card { --w: 26px; }
.tally .cards .sep { width: 6px; }
.tally .cards .meld-tag { font-size: 11px; color: #6a6250; margin-right: 2px; }
.tally .num { text-align: right; font: 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tally .num small { display: block; font: 500 10px/1.2 var(--font-ui); color: #6a6250; margin-bottom: 3px; }
.tally .round { grid-area: round; }
.tally .total { grid-area: total; min-width: 52px; }
.tally .sum { grid-area: sum; font-size: 12px; color: #5a5242; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty-hand { font-size: 12px; color: #6a6250; }

.scoretable-wrap { overflow-x: auto; margin-top: 12px; }
table.scores { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }

<script>
/* 나일롱뽕 규칙 엔진
 * - 상태는 JSON으로 그대로 저장/전송할 수 있는 순수 데이터
 * - apply(state, action)로만 상태가 바뀜 → 2차(온라인 방)에서도 그대로 재사용
 * - 규칙 출처: 나무위키 '나이롱뽕' 문서
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.NP = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const MONTH_NAMES = ['', '송학', '매조', '벚꽃', '흑싸리', '난초', '모란', '홍싸리', '공산', '국진', '단풍', '오동', '비'];

  const DEFAULT_RULES = Object.freeze({
    stopLimit: 5,           // 손패 합이 이 값 이하일 때 스톱 가능 (지역에 따라 10)
    stopPenalty: 30,        // 스톱 실패 시 손패 합에 더하는 점수 (지역에 따라 50)
    bagaji: 20,             // 박·자연바가지를 맞은 사람이 더 받는 점수
    chongtongStrict: false, // true면 4-2 형태만 총통으로 인정
    naturalFree: true,      // 손패 속 자연뽕(같은 월 3장)은 점수에서 뺌 (기본값, 끄면 그대로 셈)
    jayeon42: true,         // 손에 3장+2장일 때 3장짜리 월이 버려져 4-2가 되면 자연바가지로 봄 (나무위키엔 없는 지역 규칙, 끄면 일반 뽕)
    battle: false,          // 전투모드: 뽕은 기다려 주지 않음. 다음 사람이 패를 가져가기 전에 먼저 눌러야 함 (박·자연바가지는 자동)
  });

  // 규칙이나 판 진행 방식이 바뀌면 1씩 올림. 랭킹 기록은 게임 화면과 서버의 값이 같아야만 받음
  // (예전 화면을 열어 둔 채 서버만 바뀌면 서버가 다시 둔 결과가 달라질 수 있어서)
  const RULES_VERSION = 2;

  const monthOf = (id) => (id >> 2) + 1; // 카드 id 0~47 → 월 1~12

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffledDeck(rand) {
    const a = [];
    for (let i = 0; i < 48; i++) a.push(i);
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sumMonths(hand) {
    let s = 0;
    for (const c of hand) s += monthOf(c);
    return s;
  }

  // 점수로 세는 손패 합 (하우스 룰이 켜져 있으면 자연뽕 3장은 뺌)
  function handTotal(hand, rules) {
    let s = sumMonths(hand);
    if (rules && rules.naturalFree) {
      const cnt = new Array(13).fill(0);
      for (const c of hand) cnt[monthOf(c)]++;
      for (let m = 1; m <= 12; m++) if (cnt[m] >= 3) s -= 3 * m;
    }
    return s;
  }

  // 6장 족보. 여러 개에 해당하면 점수가 가장 좋은(낮은) 것을 고름
  function findJokbo(hand, rules) {
    if (!hand || hand.length !== 6) return null;
    const cnt = new Array(13).fill(0);
    let sum = 0;
    for (const c of hand) { const m = monthOf(c); cnt[m]++; sum += m; }
    const groups = cnt.filter((x) => x > 0).sort((a, b) => b - a);
    const found = [];
    if (groups[0] === 4) {
      const strictOk = groups.length === 2 && groups[1] === 2;
      if (!(rules && rules.chongtongStrict) || strictOk) found.push({ key: 'chongtong', name: '총통', score: -100 });
    }
    if (sum <= 10) found.push({ key: 'under10', name: '10 부족', score: -100 });
    if (sum >= 60) found.push({ key: 'over60', name: '60 이상', score: -100 });
    if (groups.length === 6) {
      let lo = 13, hi = 0;
      for (let m = 1; m <= 12; m++) if (cnt[m]) { lo = Math.min(lo, m); hi = Math.max(hi, m); }
      if (hi - lo === 5) found.push({ key: 'straight', name: '스트레이트', score: -sum });
    }
    const ttoi = (groups.length === 2 && groups[0] === 3 && groups[1] === 3) ||
      (groups.length === 3 && groups.every((g) => g === 2));
    if (ttoi) found.push({ key: 'ttoi', name: '또이또이', score: 0 });
    if (!found.length) return null;
    found.sort((a, b) => a.score - b.score);
    return { key: found[0].key, name: found[0].name, score: found[0].score, sum, all: found.map((f) => f.name) };
  }

  // 지금 손패로 바로 끝낼 수 있는지: 6장 족보, 또는 뽕한 뒤 남은 3장이 모두 같은 월(자연뽕 → 패를 다 턴 것)
  function findWin(hand, rules) {
    if (!hand) return null;
    if (hand.length === 6) return findJokbo(hand, rules);
    if (hand.length === 3 && hand.every((c) => monthOf(c) === monthOf(hand[0]))) {
      return { key: 'natural3', name: '자연뽕', score: 0, sum: sumMonths(hand), all: ['자연뽕 — 패를 다 털었어요'] };
    }
    return null;
  }

  // 버림패 card에 대해 이 손패로 할 수 있는 것: null | 'ppong' | 'bak' | 'jayeon'
  function claimKind(hand, card, rules) {
    const m = monthOf(card);
    const same = hand.filter((x) => monthOf(x) === m);
    if (same.length < 2) return null;
    if (hand.length === 2) return 'bak'; // 이미 한 번 뽕해서 남은 2장이 모두 같은 월
    if (hand.length === 5) {
      const used = same.slice(0, 2);
      const rest = hand.filter((x) => !used.includes(x));
      if (rest.length === 3 && rest.every((x) => monthOf(x) === monthOf(rest[0]))) return 'jayeon';
      // 4-2: 같은 월 3장을 쥐고 있는데 그 월이 버려짐 + 나머지 2장이 같은 월
      const others = hand.filter((x) => monthOf(x) !== m);
      if (rules && rules.jayeon42 && same.length === 3 && others.length === 2 && monthOf(others[0]) === monthOf(others[1])) return 'jayeon';
    }
    return 'ppong';
  }

  function createGame(opts) {
    if (!opts || !Array.isArray(opts.players)) throw new Error('players가 필요해요');
    const n = opts.players.length;
    if (n < 2 || n > 6) throw new Error('2~6명까지 할 수 있어요');
    const state = {
      v: 1,
      rules: Object.assign({}, DEFAULT_RULES, opts.rules || {}),
      players: opts.players.map((p) => ({
        name: String(p.name || '플레이어'),
        kind: p.kind === 'human' ? 'human' : 'ai',
        persona: p.persona || null,
        hand: [], melds: [], score: 0, drawsSinceMeld: 0,
      })),
      rounds: Math.max(1, (opts.rounds | 0) || 5),
      round: 0,
      dealer: Math.min(n - 1, Math.max(0, opts.firstDealer | 0)),
      seed: (opts.seed >>> 0) || 1,
      deck: [], pile: [],
      turn: 0, phase: 'idle', claim: null,
      result: null, history: [],
      step: 0,
    };
    deal(state);
    return state;
  }

  // 반시계방향으로 3장씩, 이어서 선에게 3장·나머지 2장씩 → 선 6장, 나머지 5장
  function deal(state) {
    state.round += 1;
    const rand = mulberry32((state.seed + Math.imul(state.round, 0x9E3779B9)) >>> 0);
    const deck = shuffledDeck(rand);
    const n = state.players.length;
    for (const p of state.players) { p.hand = []; p.melds = []; p.drawsSinceMeld = 0; }
    const order = [];
    for (let k = 0; k < n; k++) order.push((state.dealer + k) % n);
    for (const i of order) for (let c = 0; c < 3; c++) state.players[i].hand.push(deck.pop());
    for (const i of order) {
      const extra = i === state.dealer ? 3 : 2;
      for (let c = 0; c < extra; c++) state.players[i].hand.push(deck.pop());
    }
    state.pile = [{ card: deck.pop(), by: -1, kind: 'open' }];
    state.deck = deck;
    state.turn = state.dealer;
    state.phase = 'discard'; // 선은 이미 6장이므로 버리기부터
    state.claim = null;
    state.result = null;
  }

  function canStop(state, p) {
    if (state.phase !== 'draw' || state.turn !== p) return false;
    return handTotal(state.players[p].hand, state.rules) <= state.rules.stopLimit;
  }

  function findClaimer(state, from, card) {
    const n = state.players.length;
    for (let k = 1; k < n; k++) {
      const q = (from + k) % n;
      if (claimKind(state.players[q].hand, card, state.rules)) return q;
    }
    return -1;
  }

  // 지금 결정을 내려야 하는 사람
  function actorOf(state) {
    if (state.phase === 'claim' && state.claim) return state.claim.p;
    if (state.phase === 'draw' || state.phase === 'discard') return state.turn;
    return -1;
  }

  function legalActions(state, p) {
    const out = [];
    const pl = state.players[p];
    if (!pl) return out;
    switch (state.phase) {
      case 'draw':
        if (state.claim && state.claim.open && state.claim.p === p) out.push({ type: 'claim', p });
        if (state.turn === p) {
          out.push({ type: 'draw', p });
          if (canStop(state, p)) out.push({ type: 'stop', p });
        }
        break;
      case 'discard':
        if (state.turn === p) {
          if (findWin(pl.hand, state.rules)) out.push({ type: 'declare', p });
          for (const c of pl.hand) out.push({ type: 'discard', p, card: c });
        }
        break;
      case 'claim':
        if (state.claim && state.claim.p === p) {
          out.push({ type: 'claim', p });
          out.push({ type: 'pass', p });
        }
        break;
      case 'roundEnd':
        out.push({ type: 'next', p });
        break;
    }
    return out;
  }

  // 전투모드: 다음 사람이 움직이면 열려 있던 뽕 기회가 사라짐
  function closeClaim(state, ev) {
    if (state.claim && state.claim.open) {
      ev.push({ t: 'missed', p: state.claim.p });
      state.claim = null;

    let ctx = null, on = true, noiseBuf = null;
    function ac() {
      if (!on) return null;
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        if (!noiseBuf) {
          noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        return ctx;
      } catch (e) { return null; }
    }
    function noise(dur, type, freq, q, gain, delay = 0) {
      const a = ac(); if (!a) return;
      const t = a.currentTime + delay;
      const src = a.createBufferSource(); src.buffer = noiseBuf;
      const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;

      const a = ac(); if (!a) return;
      const t = a.currentTime + delay;

      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }

      get on() { return on; },
      set on(v) { on = !!v; },
      unlock() { ac(); },
      tak() { noise(0.07, 'bandpass', 2300, 1.1, 0.55); tone(150, 0.06, 'sine', 0.35, 0, 90); },

        for (let i = 0; i < 46; i++) noise(0.05 + Math.random() * 0.05, 'bandpass', 1200 + Math.random() * 2400, 1.5, 0.05 + Math.random() * 0.07, 0.3 + Math.random() * 2.2);
      },
    };
  })();

  /* ───────── 저장 ───────── */
  function loadStore() {
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
  }
  function saveStore() {
    try {
      // 사람들과 하는 동안이나 보기용 판일 때는 혼자 하던 판을 덮어쓰지 않음
      const keep = online || preview ? (loadStore().game || null) : (G && G.phase !== 'gameEnd' ? G : null);
      localStorage.setItem(STORE_KEY, JSON.stringify({ settings: S, sound: Sound.on, mode: startMode, game: keep }));
    } catch (e) { /* 저장 안 돼도 게임은 계속 */ }
  }
  function cleanSettings(s) {
    const out = JSON.parse(JSON.stringify(DEFAULTS));
    if (s && typeof s === 'object') {
      if ([1, 2, 3].includes(s.cpu)) out.cpu = s.cpu;
      if ([3, 5, 10].includes(s.rounds)) out.rounds = s.rounds;
      if (['normal', 'fast'].includes(s.speed)) out.speed = s.speed;
      if (s.rules && typeof s.rules === 'object') {
        if ([5, 10].includes(s.rules.stopLimit)) out.rules.stopLimit = s.rules.stopLimit;
        if ([30, 50].includes(s.rules.stopPenalty)) out.rules.stopPenalty = s.rules.stopPenalty;
        if ([20, 30].includes(s.rules.bagaji)) out.rules.bagaji = s.rules.bagaji;
        out.rules.chongtongStrict = !!s.rules.chongtongStrict;
        out.rules.battle = !!s.rules.battle;
        if (typeof s.rules.jayeon42 === 'boolean') out.rules.jayeon42 = s.rules.jayeon42;
        if (s.rules.rv === 2) out.rules.naturalFree = !!s.rules.naturalFree; // 예전 저장값은 새 기본값(빼 줌)으로
      }
    }
    return out;
  }
  function validGame(g) {
    return g && g.v === 1 && Array.isArray(g.players) && g.players.length >= 2 && Array.isArray(g.deck) && Array.isArray(g.pile) && typeof g.phase === 'string';
  }

  /* ───────── 상태 ───────── */
  let G = null;          // 엔진 상태
  let S = cleanSettings(null);
  let busy = false;
  let selected = null;
  let timers = [];
  let lastLine = '';
  let preview = false;   // 시작 화면 뒤에 깔린 보기용 판
  let gen = 0;           // 새 게임마다 올라감 (이전 게임의 애니메이션이 새 게임을 건드리지 않게)
  let dealing = false;
  let shownFor = null;   // 이미 자동으로 보여 준 결과 시트
  let online = null;     // 사람들과 하는 중이면 { code, seat, room, skew, gen }
  let sheetKind = null;  // 지금 열린 시트 종류
  let startMode = 'online';
  const recent = [];     // 최근 진행 기록 (고장 신고에 같이 보냄)
  const BUILD = '2026-10-20T10:33';

  const T = (ms) => (reduceMotion ? 0 : Math.round(ms * (S.speed === 'fast' ? 0.5 : 1)));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const AVS = ['var(--av-1)', 'var(--av-2)', 'var(--av-3)', 'var(--av-4)'];
  function seatInfo(i) {
    if (i === HUMAN) return ME;
    if (online && G && G.players[i]) {
      const p = G.players[i];
      return { name: p.name, short: Array.from(p.name)[0] || '?', av: AVS[(p.abs || 0) % AVS.length] };
    }
    return CPU[(i - 1) % CPU.length];
  }
  const nameOf = (i) => esc(G && G.players[i] ? G.players[i].name : seatInfo(i).name);
  function josa(word, withB, withoutB) {
    const ch = word.charCodeAt(word.length - 1);
    if (ch < 0xac00 || ch > 0xd7a3) return word + withoutB;
    return word + ((ch - 0xac00) % 28 ? withB : withoutB);
  }
  const subj = (i) => josa(nameOf(i), '이', '가');
  const monthObj = (id) => `${M(id)}월(${MONTHS[M(id)]})을`;

  /* ───────── 그리기 ───────── */
  function avatarHTML(i) {
    const info = seatInfo(i);
    return `<span class="avatar" style="--av:${info.av}" aria-hidden="true">${esc(info.short)}</span>`;
  }
  function seatOrder() {
    const n = G.players.length, out = [];
    for (let i = n - 1; i >= 1; i--) out.push(i);
    return out;
  }
  // 사람들과 할 때: 자리 상태 표시
  function seatTag(i) {
    const si = online && G && G.players[i] ? G.players[i].seatInfo : null;
    if (!si) return '';
    if (si.kind === 'ai') return '<span class="tag">컴퓨터</span>';
    if (!si.online) return '<span class="tag off">끊김</span>';
    if (si.away) return '<span class="tag off">자리 비움</span>';
    return '';
  }
  // 사람들과 할 때: 남은 시간 막대
  function timerBar() {
    if (!online || !online.room || !online.room.deadline || !G) return null;
    const left = online.room.deadline - (Date.now() + online.skew);
    if (left <= 0) return null;
    const total = G.phase === 'claim' ? 10000 : G.phase === 'roundEnd' ? 30000 : 25000;
    const b = el('span', 'tbar' + (left < 6000 ? ' hot' : ''), '<i></i>');
    b.style.setProperty('--t', Math.round(left) + 'ms');
    b.style.setProperty('--from', Math.min(1, left / total).toFixed(3));
    return b;
  }
  function meldChip(meld) {
    const w = el('span', 'meld');
    w.appendChild(makeCard(meld[0]));
    w.appendChild(document.createTextNode('×3'));

  }

  function render(opt = {}) {
    if (!G) return;
    const actor = ['draw', 'discard', 'claim'].includes(G.phase) ? NP.actorOf(G) : -1;
    $('#roundChip').textContent = online ? (preview ? `방 ${online.code}` : `${G.round}/${G.rounds}판 · 방 ${online.code}`) : `${G.round} / ${G.rounds}판`;

    // 상대 자리
    const seats = $('#seats');
    seats.style.setProperty('--opp', G.players.length - 1);
    seats.innerHTML = '';
    for (const i of seatOrder()) {
      const pl = G.players[i];
      const s = el('div', 'seat' + (actor === i && !preview ? ' turn' : ''));
      s.dataset.p = i;
      const head = el('div', 'who');
      head.innerHTML = `${avatarHTML(i)}<span class="name">${esc(pl.name)}</span>${G.dealer === i ? '<span class="sun" title="선">선</span>' : ''}${seatTag(i)}`;
      s.appendChild(head);
      const row = el('div', 'seat-row');
      const minis = el('div', 'minis');
      let count = opt.hideHands ? 0 : pl.hand.length;
      if (opt.seatIncoming === i) count = Math.max(0, count - 1);
      for (let k = 0; k < count; k++) minis.appendChild(el('span', 'mini'));
      minis.setAttribute('aria-label', `손패 ${pl.hand.length}장`);
      if (!opt.hideHands && !pl.hand.length) minis.appendChild(el('span', 'out-tag', '다 털었음'));
      row.appendChild(minis);
      row.appendChild(el('span', 'seat-score', `${pl.score}점`)).title = '누적 점수';
      s.appendChild(row);
      if (pl.melds.length) {
        const md = el('div', 'melds');
        pl.melds.forEach((m) => md.appendChild(meldChip(m)));
        s.appendChild(md);
      }
      if (actor === i && !preview) {
        s.insertAdjacentHTML('beforeend', '<span class="thinking" aria-label="생각 중"><i></i><i></i><i></i></span>');
        const tb = timerBar();
        if (tb) s.appendChild(tb);
      }
      seats.appendChild(s);
    }

    // 더미
    const deck = $('#deck');
    deck.innerHTML = '';
    const dn = opt.hidePile ? G.deck.length + 1 : G.deck.length;
    const layers = Math.min(3, dn);
    for (let k = layers - 1; k >= 0; k--) {
      const b = makeBack();
      b.style.transform = `translate(${-k * 2}px, ${-k * 2}px)`;
      deck.appendChild(b);
    }
    if (!dn) deck.innerHTML = '<span class="pile-empty"></span>';
    const myDraw = !preview && G.phase === 'draw' && G.turn === HUMAN && !busy;
    deck.classList.toggle('can', myDraw);
    deck.setAttribute('aria-label', `더미 ${dn}장${myDraw ? ', 눌러서 한 장 가져오기' : ''}`);
    deck.tabIndex = myDraw ? 0 : -1;
    $('#deckLabel').textContent = `더미 ${dn}장`;

    // 버림패
    const pile = $('#pile');
    pile.innerHTML = '<span class="pile-empty"></span>';
    const shown = opt.hidePile ? [] : G.pile.slice(-3);
    shown.forEach((e, k) => {
      const c = makeCard(e.card);
      const top = k === shown.length - 1;
      const depth = shown.length - 1 - k;
      const jitter = ((e.card * 37) % 11) - 5;
      c.style.transform = top ? 'rotate(0deg)' : `translate(${depth * -5 + jitter * 0.4}px, ${depth * -3}px) rotate(${jitter * 1.4}deg)`;
      if (opt.pileHidden && opt.pileHidden.includes(e.card)) c.classList.add('incoming');
      if (top) c.classList.add('top');
      pile.appendChild(c);
    });
    const topE = G.pile[G.pile.length - 1];
    let cap = '';
    if (!opt.hidePile && topE) {
      if (topE.by < 0) cap = '처음 뒤집은 패';
      else if (topE.kind === 'meld') cap = topE.by === HUMAN ? '내가 뽕' : `${nameOf(topE.by)} 뽕`;
      else cap = topE.by === HUMAN ? '내가 버림' : `${nameOf(topE.by)} 버림`;
    }
    $('#pileLabel').textContent = cap;
    const iCanClaim = (G.phase === 'claim' || (G.phase === 'draw' && G.claim && G.claim.open)) && G.claim && G.claim.p === HUMAN && !preview;
    pile.classList.toggle('claimable', iCanClaim);

    // 나온 패
    const seen = new Array(13).fill(0), mine = new Array(13).fill(0);
    if (!opt.hidePile) G.pile.forEach((e) => { if (!(opt.pileHidden && opt.pileHidden.includes(e.card))) seen[M(e.card)]++; });
    if (!opt.hideHands && !preview) G.players[HUMAN].hand.forEach((c) => { if (c !== opt.incoming) mine[M(c)]++; });
    const tr = $('#tracker');
    tr.innerHTML = '';
    for (let m = 1; m <= 12; m++) {
      const cell = el('div', 'tk' + (seen[m] + mine[m] >= 3 ? ' dead' : ''));
      let pips = '';
      for (let k = 0; k < 4; k++) pips += `<i class="pip${k < seen[m] ? ' seen' : k < seen[m] + mine[m] ? ' mine' : ''}"></i>`;
      cell.innerHTML = `<b>${m}</b><span class="pips">${pips}</span>`;
      cell.title = `${m}월 ${MONTHS[m]} · 나온 패 ${seen[m]}장, 내 손 ${mine[m]}장`;
      tr.appendChild(cell);
    }

    // 내 자리
    const me = G.players[HUMAN];
    const meEl = $('#me');
    meEl.classList.toggle('turn', actor === HUMAN && !preview);
    meEl.querySelectorAll(':scope > .tbar').forEach((n) => n.remove());
    if (actor === HUMAN && !preview) { const tb = timerBar(); if (tb) meEl.appendChild(tb); }
    const total = NP.handTotal(me.hand, G.rules);
    $('#meHead').innerHTML = `${avatarHTML(HUMAN)}<span class="name" style="font-weight:700">나</span>${G.dealer === HUMAN ? '<span class="sun" title="선">선</span>' : ''}` +
      `${me.melds.length ? `<span class="melds" id="myMelds"></span>` : ''}` +
      `<span class="stat">손패 합<b>${opt.hideHands || preview ? '–' : total}</b></span><span class="stat">누적<b>${me.score}</b></span>`;
    if (me.melds.length) { const md = $('#myMelds'); me.melds.forEach((m) => md.appendChild(meldChip(m))); }

    const hand = $('#hand');
    hand.innerHTML = '';
    const canPick = !preview && G.phase === 'discard' && G.turn === HUMAN;
    hand.classList.toggle('pick', canPick);
    if (!opt.hideHands) {
      const sorted = me.hand.slice().sort((a, b) => a - b);
      const claimM = iCanClaim ? M(G.claim.card) : 0;
      let matched = 0;
      for (const id of sorted) {
        const c = preview ? makeBack() : makeCard(id, 'button');
        if (!preview) {
          if (id === opt.incoming) c.classList.add('incoming');
          if (opt.hiddenCards && opt.hiddenCards.includes(id)) c.classList.add('incoming');
          if (canPick && selected === id) c.classList.add('sel');
          if (claimM && M(id) === claimM && matched < 2) { c.classList.add('match'); matched++; }
          c.tabIndex = canPick ? 0 : -1;
          c.addEventListener('click', () => onCardClick(id));
        }
        hand.appendChild(c);
      }
    }
    if (canPick && selected != null && !me.hand.includes(selected)) selected = null;
    renderActions();
  }

  function btn(label, cls, onClick, sub) {
    const b = el('button', 'btn ' + (cls || ''));

    b.innerHTML = label + (sub ? ` <small>${sub}</small>` : '');
    b.addEventListener('click', onClick);
    return b;
  }

  function renderActions() {
    const box = $('#actions');
    box.innerHTML = '';
    box.classList.toggle('wait', !!(online && busy && !dealing));
    box.classList.toggle('tall', !!(G && G.rules && G.rules.battle)); // 전투모드: 뽕 버튼이 생겨도 높이가 안 변하게
    if (!G || preview || dealing) return;
    const me = G.players[HUMAN];
    if (G.phase === 'roundEnd') { box.appendChild(btn('점수표 보기', '', () => showRoundSheet())); return; }
    if (G.phase === 'gameEnd') { box.appendChild(btn('최종 결과', 'gold', () => showGameEnd())); return; }
    const actor = NP.actorOf(G);
    if (actor == null || actor < 0) { box.appendChild(el('p', 'hint', '잠시만요…')); return; }
    // 전투모드: 다음 사람이 가져가기 전에 먼저 눌러야 하는 뽕
    const mineOpen = G.phase === 'draw' && G.claim && G.claim.open && G.claim.p === HUMAN;
    if (mineOpen) {
      box.appendChild(btn('뽕!', 'primary shout', () => act({ type: 'claim', p: HUMAN }), ''));
      if (actor !== HUMAN) {
        box.insertAdjacentHTML('beforeend', `<p class="hint" style="flex-basis:100%">${M(G.claim.card)}월 2장 내려놓기 · ${esc(nameOf(actor))}보다 먼저 누르세요!</p>`);
        return;
      }
    }
    if (G.phase === 'claim' && G.rules.battle) { box.appendChild(el('p', 'hint', G.claim && G.claim.p === HUMAN ? '이기는 패예요! 자동으로 가져가요' : '잠시만요…')); return; }
    if (actor !== HUMAN) {
      box.appendChild(el('p', 'hint', `${nameOf(actor)} 차례예요`));
      return;
    }
    const clock = online ? ' · <span class="clock" data-clock></span>' : '';
    if (G.phase === 'draw') {
      // 전투모드: 버린 직후엔 가져오기 버튼을 잠깐 숨겨 둠 (뽕할 수 있으면 더 길게) → 뽕 누르려다 가져오기를 누르는 일 줄이기
      const hold = drawHoldLeft(mineOpen);
      const dbtn = btn('한 장 가져오기', 'primary', () => act({ type: 'draw', p: HUMAN }));
      box.appendChild(dbtn);
      let sbtn = null;
      if (NP.canStop(G, HUMAN)) {
        sbtn = btn('스톱', 'gold', () => act({ type: 'stop', p: HUMAN }), `합 ${NP.handTotal(me.hand, G.rules)}`);
        box.appendChild(sbtn);
      }
      if (hold > 0) {
        [dbtn, sbtn].forEach((b) => { if (b) { b.disabled = true; b.style.visibility = 'hidden'; } }); // 자리는 그대로 두고 안 보이게 → 나중에 나타나도 화면이 안 움직임
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => { if (!busy) renderActions(); }, hold + 30);
      }
    } else if (G.phase === 'discard') {
      const jk = NP.findWin(me.hand, G.rules);
      if (jk) box.appendChild(btn(jk.key === 'natural3' ? '자연뽕! 다 털기' : `족보! ${jk.name}`, 'gold', () => act({ type: 'declare', p: HUMAN }), `${jk.score > 0 ? '+' : ''}${jk.score}점`));
      if (selected != null && me.hand.includes(selected)) {
        box.appendChild(btn(`${M(selected)}월 버리기`, 'primary', () => act({ type: 'discard', p: HUMAN, card: selected })));
      } else {
        box.appendChild(el('p', 'hint', (me.hand.length === 3 && me.drawsSinceMeld === 0 ? '뽕 했어요. 남은 3장 중 버릴 패를 고르세요' : '버릴 패를 골라 주세요 · 두 번 누르면 바로 버려요') + clock));
      }
    } else if (G.phase === 'claim' && G.claim && G.claim.p === HUMAN) {
      const k = G.claim.kind;
      const label = k === 'bak' ? '박!' : k === 'jayeon' ? '자연바가지!' : '뽕!';
      const sub = k === 'ppong' ? `${M(G.claim.card)}월 2장 내려놓기` : '패를 다 털고 0점';
      box.appendChild(btn(label, 'primary shout', () => act({ type: 'claim', p: HUMAN }), ''));
      box.appendChild(btn('넘기기', '', () => act({ type: 'pass', p: HUMAN })));
      box.insertAdjacentHTML('beforeend', `<p class="hint" style="flex-basis:100%">${sub}${clock}</p>`);
    }
    if (online && G.phase === 'draw') box.insertAdjacentHTML('beforeend', `<p class="hint" style="flex-basis:100%">남은 시간<span class="clock" data-clock style="margin-left:4px"></span></p>`);
  }

  let holdTimer = null;
  function drawHoldLeft(mineOpen) {
    if (!G || !G.rules.battle || G.phase !== 'draw' || G.turn !== HUMAN) return 0;
    return (mineOpen ? BATTLE.holdClaim : BATTLE.grace) - (Date.now() - battleOpenAt);
  }

  function say(html) {
    lastLine = html;
    $('#msg').innerHTML = html;
  }

  /* ───────── 움직임 ───────── */
  function rectOf(node) { return node ? node.getBoundingClientRect() : null; }
  function seatHandRect(i) {
    const seat = document.querySelector(`.seat[data-p="${i}"]`);
    if (!seat) return null;
    const minis = seat.querySelectorAll('.mini');
    const last = minis[minis.length - 1];
    if (last) return rectOf(last);
    const r = rectOf(seat.querySelector('.minis'));
    return r ? new DOMRect(r.left, r.top, 14, 22) : rectOf(seat);
  }
  function anchorRect(i) {
    if (i === HUMAN) return rectOf($('#hand'));

  }
  function fly(card, from, to, o = {}) {
    if (!from || !to || T(100) === 0) return Promise.resolve();
    const g = card == null ? makeBack('ghost') : makeCard(card, 'div', 'ghost');
    g.style.setProperty('--w', to.width + 'px');
    g.style.left = to.left + 'px';
    g.style.top = to.top + 'px';
    $('#fx').appendChild(g);
    const sx = from.width / to.width, sy = from.height / to.height;
    const dx = from.left - to.left, dy = from.top - to.top;
    const a = g.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy}) rotate(${o.spin || 0}deg)` },
      { transform: 'translate(0, 0) scale(1, 1) rotate(0deg)' },
    ], { duration: o.dur != null ? o.dur : T(320), delay: o.delay || 0, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'both' });
    return a.finished.then(() => g.remove(), () => g.remove());
  }
  function stamp(text, rect, sub) {
    if (!rect) return;
    const s = el('div', 'stamp', text + (sub ? `<small>${sub}</small>` : ''));
    s.style.left = rect.left + rect.width / 2 + 'px';
    s.style.top = rect.top + rect.height / 2 + 'px';
    $('#fx').appendChild(s);
    setTimeout(() => s.classList.add('out'), Math.max(900, T(1300)));
    setTimeout(() => s.remove(), Math.max(1300, T(1700)));
  }
  function shake() {
    if (reduceMotion) return;
    $('#felt').animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-4px,1px)' }, { transform: 'translate(4px,-1px)' }, { transform: 'translate(-2px,0)' }, { transform: 'translate(0,0)' }], { duration: 260 });
  }

  /* ───────── 진행 ───────── */
  function snapshotFrom(a, ev) {
    const out = {};
    if (a.type === 'draw') out.deck = rectOf($('#deck .card:last-child')) || rectOf($('#deck'));
    if (a.type === 'discard') {
      out.src = a.p === HUMAN ? rectOf(document.querySelector(`#hand .card[data-id="${a.card}"]`)) : seatHandRect(a.p);
    }
    if (a.type === 'claim') {
      const ce = ev && ev.find((e) => e.t === 'claim');
      let used = ce ? ce.used : null;
      if (!used) { const m = M(G.claim.card); used = G.players[a.p].hand.filter((x) => M(x) === m).slice(0, 2); }
      out.srcs = used.map((id) => (a.p === HUMAN ? rectOf(document.querySelector(`#hand .card[data-id="${id}"]`)) : seatHandRect(a.p)));
    }
    return out;
  }

  let actGuard = null;
  async function act(a) {
    if (busy || !G || preview) return;
    if (a.p === HUMAN) Sound.unlock();
    if (online) { // 사람들과 할 때는 서버에 보내고 결과를 기다림
      if (a.type === 'next') { Net.send({ t: 'ready' }); return; }
      if (!Net.send({ t: 'act', type: a.type, card: a.card })) { say('연결이 끊겼어요. 다시 연결하는 중이에요'); return; }
      busy = true;
      renderActions();
      clearTimeout(actGuard);
      actGuard = setTimeout(() => { if (busy && online) { busy = false; render(); } }, 5000);
      return;
    }
    // 전투모드: 버린 직후 잠깐은 가져갈 수 없음 (그사이 뽕이 먼저 들어오면 이 가져오기는 취소됨)
    if (G.rules.battle && a.p === HUMAN && (a.type === 'draw' || a.type === 'stop')) {
      const rem = battleOpenAt + BATTLE.grace - Date.now();
      if (rem > 0) { later(() => act(a), rem); return; }
    }
    const g0 = gen;
    busy = true;
    clearTimers();
    let ev = [];
    try {
      const from = snapshotFrom(a);
      ev = NP.apply(G, a);
      if (G.rank && a.p === HUMAN && a.type !== 'next') G.rank.log.push(a.type === 'discard' ? a.card : ({ draw: 'd', stop: 's', declare: 'j', claim: 'c', pass: 'p' })[a.type]);
      if (a.type === 'discard' || a.type === 'claim' || a.type === 'pass') selected = null;
      saveStore();
      await present(a, ev, from);
      if (a.type === 'discard') battleOpenAt = Date.now();
    } catch (err) {
      console.error(err);
      if (gen === g0) say('그 행동은 지금 할 수 없어요');
    }
    if (gen !== g0) return; // 그사이 새 게임이 시작됨
    busy = false;
    render();
    saveStore();
    tick();
  }
  const resume = () => { if (G && !preview && !busy) { render(); tick(); } };

  async function present(a, ev, from) {
    const p = a.p;
    try {
      recent.push({ type: a.type, p, card: a.card, step: G && G.step, at: Date.now() });
      if (recent.length > 20) recent.shift();
    } catch (e) { /* 기록은 없어도 됨 */ }
    switch (a.type) {
      case 'draw': {
        const card = ev[0].card;
        if (p === HUMAN) {
          render({ incoming: card });
          const to = rectOf(document.querySelector(`#hand .card[data-id="${card}"]`));
          Sound.swish();
          await fly(card, from.deck, to, { spin: -6 });
          say(`${monthObj(card)} 가져왔어요. 버릴 패를 고르세요`);
        } else {
          render({ seatIncoming: p });
          Sound.swish();
          // 상대 자리의 맨 끝 자리로
          const seat = document.querySelector(`.seat[data-p="${p}"] .minis`);
          const lastMini = seat && seat.lastElementChild;
          const r = lastMini ? rectOf(lastMini) : seatHandRect(p);
          const to = r ? new DOMRect(r.left + (lastMini ? 8 : 0), r.top, 14, 22) : null;
          await fly(null, from.deck, to);
          say(ev.some((e) => e.t === 'missed' && e.p === HUMAN) ? `${nameOf(p)}가 먼저 가져갔어요 — <em>뽕</em> 기회를 놓쳤어요` : `${nameOf(p)} 차례 — 한 장 가져갔어요`);
        }
        break;
      }
      case 'discard': {
        battleOpenAt = Date.now() + 60000; // 패가 날아가는 동안은 가져오기 버튼을 숨김 (잠깐 보였다 사라지는 깜빡임 방지)
        render({ pileHidden: [a.card] });
        const top = rectOf($('#pile .card.top'));
        await fly(a.card, from.src, top, { spin: 8 });
        $('#pile .card.top') && $('#pile .card.top').classList.remove('incoming');
        Sound.tak();
        const who = p === HUMAN ? `${monthObj(a.card)} 버렸어요` : `${subj(p)} <em>${monthObj(a.card)}</em> 버렸어요`;
        battleOpenAt = Date.now(); // 여기서부터 0.7초(뽕 가능하면 1.3초) 뒤에 가져오기 버튼
        renderActions();
        const chance = ev.find((e) => e.t === 'claimChance');
        if (chance && chance.p === HUMAN && chance.open) {
          say(`${who} — <em>뽕!</em> 빨리 누르세요`);
          Sound.ping();
        } else if (chance && chance.p === HUMAN) {
          say(`${who} — <em>${chance.kind === 'ppong' ? '뽕' : chance.kind === 'bak' ? '박' : '자연바가지'}</em> 할 수 있어요!`);
          Sound.ping();
        } else if (ev.some((e) => e.t === 'exhaust')) {
          say(`${who} 더미가 다 떨어졌어요`);
        } else {
          say(who);
        }
        break;
      }
      case 'claim': {
        const e = ev.find((x) => x.t === 'claim');
        const label = e.kind === 'bak' ? '박!' : e.kind === 'jayeon' ? '자연바가지!' : '뽕!';
        stamp(label, anchorRect(p), p === HUMAN ? '' : nameOf(p));
        Sound.slam();
        shake();
        render({ pileHidden: e.used, hiddenCards: [] });
        const cards = $('#pile').querySelectorAll('.card');
        const targets = Array.from(cards).slice(-2).map(rectOf);
        await Promise.all(e.used.map((id, k) => fly(id, from.srcs[k], targets[k], { delay: k * T(70), spin: k ? 10 : -10 })));
        render();
        if (e.kind === 'ppong') {
          say(p === HUMAN ? `<em>뽕!</em> ${M(e.card)}월 세 장을 내려놨어요. 한 장 버리세요` : `${nameOf(p)} <em>뽕!</em> ${M(e.card)}월 세 장`);
        } else {
          say(`${nameOf(p)} <em>${label}</em> 패를 다 털었어요`);
        }
        await wait(T(450));
        break;
      }
      case 'pass':
        render();
        say('넘겼어요');
        break;
      case 'stop': {
        stamp('스톱!', anchorRect(p), p === HUMAN ? '' : nameOf(p));
        Sound.slam();
        shake();
        say(`${p === HUMAN ? '' : nameOf(p) + ' '}<em>스톱!</em> 모두 패를 공개해요`);
        render();
        await wait(Math.max(700, T(900)));
        break;
      }
      case 'declare': {
        const e = ev.find((x) => x.t === 'declare');
        stamp('족보!', anchorRect(p), e.jokbo.name);
        Sound.slam();
        say(`${p === HUMAN ? '' : nameOf(p) + ' '}<em>족보 — ${e.jokbo.name}</em>`);
        render();
        await wait(Math.max(800, T(1000)));
        break;
      }
      case 'start':
      case 'next': {
        await dealAnimation();
        break;
      }
      case 'wait':
        render();
        break;
    }
  }

  async function dealAnimation() {
    const n = G.players.length, d = G.dealer;
    dealing = true;
    try { await dealFly(n, d); } finally { dealing = false; }
    render();
    say(G.dealer === HUMAN ? '내가 선이에요. 6장 중 한 장을 버리며 시작해요' : `${subj(G.dealer)} 선이에요`);
  }
  async function dealFly(n, d) {
    const g0 = gen;
    render({ hideHands: true, hidePile: true });
    say(`${G.round}판 — ${G.dealer === HUMAN ? '내가' : subj(G.dealer)} 선이에요`);
    if (T(100) > 0) {
      const deckR = rectOf($('#deck .card:last-child')) || rectOf($('#deck'));
      const handR = rectOf($('#hand'));
      const hw = parseFloat(getComputedStyle($('#hand')).getPropertyValue('--hand-w')) || 52;
      const target = (i) => {
        if (i === HUMAN) return new DOMRect(handR.left + handR.width / 2 - hw / 2, handR.top + 14, hw, hw * 1.6);
        const r = rectOf(document.querySelector(`.seat[data-p="${i}"] .minis`));
        return r ? new DOMRect(r.left + 10, r.top, 14, 22) : null;
      };
      const seq = [];
      const order = [];
      for (let k = 0; k < n; k++) order.push((d + k) % n);
      order.forEach((i) => { for (let c = 0; c < 3; c++) seq.push(i); });
      order.forEach((i) => { for (let c = 0; c < (i === d ? 3 : 2); c++) seq.push(i); });
      const gap = T(48);
      seq.forEach((_, k) => setTimeout(() => Sound.tick(), k * gap));
      await Promise.all(seq.map((i, k) => fly(null, deckR, target(i), { delay: k * gap, dur: T(260) })));
      if (gen !== g0) return;
      render({ hidePile: true });
      const pileR = rectOf($('#pile'));
      await fly(G.pile[0].card, deckR, pileR, { dur: T(300), spin: 12 });
      Sound.tak();
    }
  }

  const resultKey = () => `${online ? 'o' + online.gen : gen}:${G.history.length}`;
  const endKey = () => (online ? 'end:o' + online.gen : 'end:' + gen);
  function tick() {
    clearTimers();
    if (online) { onlineAfter(); return; } // 사람들과 할 때는 서버가 진행
    if (!G || preview || busy) return;
    if (!$('#backdrop').hidden) return; // 시트를 보는 동안은 컴퓨터도 기다림
    if (G.phase === 'roundEnd') { if (shownFor !== resultKey()) later(showRoundSheet, Math.max(500, T(700))); return; }
    if (G.phase === 'gameEnd') { if (shownFor !== endKey()) showGameEnd(); return; }
    const actor = NP.actorOf(G);
    if (actor < 0) return;
    if (G.rules.battle) { battleTick(actor); return; }
    if (G.players[actor].kind === 'human') {
      if (G.phase === 'draw') say(NP.canStop(G, HUMAN) ? `내 차례 — 한 장 가져오거나 <em>스톱</em>할 수 있어요` : '내 차례 — 더미에서 한 장 가져오세요');
      return;
    }
    const view = NP.viewFor(G, actor);
    const a = NPAI.decide(view, G.players[actor].persona, NPAI.rngFor(G.seed, G.step)); // 정해진 난수 → 서버가 랭킹 기록을 다시 둬서 확인할 수 있음
    if (!a) return;
    const delay = G.phase === 'claim' ? T(380) : a.type === 'discard' ? T(520) : T(480);
    later(() => act(a), delay);
  }

  // 전투모드(혼자 하기): 컴퓨터가 가져가는 시간과 컴퓨터가 뽕 누르는 시간을 따로 재서 먼저 오는 쪽이 이김
  const BATTLE = { grace: 700, holdClaim: 1300, draw: [1000, 2000], claim: [500, 1500], auto: 600 };
  const between = ([a, b]) => Math.round(a + Math.random() * (b - a));
  let battleOpenAt = 0;
  function battleTick(actor) {
    if (G.phase === 'claim') { const q = G.claim.p; later(() => act({ type: 'claim', p: q }), BATTLE.auto); return; } // 박·자연바가지는 자동
    const c = G.claim && G.claim.open ? G.claim : null;
    if (c && c.p !== HUMAN && c.p !== actor) later(() => act({ type: 'claim', p: c.p }), between(BATTLE.claim));
    if (G.players[actor].kind === 'human') {
      if (G.phase === 'draw' && !(c && c.p === HUMAN)) say(NP.canStop(G, HUMAN) ? `내 차례 — 한 장 가져오거나 <em>스톱</em>할 수 있어요` : '내 차례 — 더미에서 한 장 가져오세요');
      return;
    }
    const a = NPAI.decide(NP.viewFor(G, actor), G.players[actor].persona, Math.random);
    if (!a) return;
    later(() => act(a), G.phase === 'draw' ? between(BATTLE.draw) : T(520));
  }

  function onCardClick(id) {
    if (busy || !G || G.phase !== 'discard' || G.turn !== HUMAN) return;
    Sound.unlock();
    if (selected === id) { act({ type: 'discard', p: HUMAN, card: id }); return; }
    selected = id;
    render();
    const b = $('#actions .btn.primary');
    if (b) b.focus({ preventScroll: true });
  }

  /* ───────── 축하 (폭죽·꽃가루) ───────── */
  let partyRun = 0;
  function celebrate(big) {
    if (reduceMotion) return;
    const cv = $('#party'), ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#c3321f', '#e2b24e', '#f1e7cf', '#e8879d', '#5b4aa3', '#8fc27a', '#2f4f8d'];
    const parts = [], rockets = [];
    const run = ++partyRun;
    // 꽃가루: 작은 화투패 (빨간 뒷면 / 미색 앞면)
    const papers = big ? 140 : 60;
    for (let i = 0; i < papers; i++) {
      parts.push({ kind: 'card', x: Math.random() * W, y: -20 - Math.random() * H * (big ? 0.9 : 0.4), vx: (Math.random() - 0.5) * 1.2, vy: 1.4 + Math.random() * 2.2,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.2, w: 7 + Math.random() * 5, back: Math.random() < 0.5, sway: Math.random() * 6.28, life: 1 });
    }
    const burst = (x, y) => {
      const c1 = colors[(Math.random() * colors.length) | 0], c2 = colors[(Math.random() * colors.length) | 0];
      const n = 70;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, sp = 2 + Math.random() * 4.2;
        parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: i % 2 ? c1 : c2, life: 1, decay: 0.011 + Math.random() * 0.01 });
      }
      Sound.pop();
    };
    if (big) {
      for (let k = 0; k < 9; k++) {
        rockets.push({ at: 250 + k * 420 + Math.random() * 200, x: W * (0.15 + Math.random() * 0.7), y: H + 10, ty: H * (0.15 + Math.random() * 0.3), fired: false, done: false });
      }
      Sound.fanfare();
      Sound.cheer();
    }
    const t0 = performance.now();
    const total = big ? 6500 : 3200;
    const step = (now) => {
      if (run !== partyRun) return;
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      for (const r of rockets) {
        if (t < r.at || r.done) continue;
        if (!r.fired) { r.fired = true; r.y0 = r.y; r.t = r.at; }
        const k = Math.min(1, (t - r.at) / 650);
        const y = r.y0 + (r.ty - r.y0) * (1 - (1 - k) * (1 - k));
        ctx.fillStyle = '#f8f1dd';
        ctx.beginPath(); ctx.arc(r.x, y, 2.2, 0, 6.28); ctx.fill();
        if (k >= 1) { r.done = true; burst(r.x, r.ty); }
      }
      for (const p of parts) {
        if (p.life <= 0) continue;
        if (p.kind === 'spark') {
          p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.06; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.c;
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 6.28); ctx.fill();
        } else {
          p.sway += 0.05; p.x += p.vx + Math.sin(p.sway) * 0.8; p.y += p.vy; p.rot += p.vr;
          if (t > total - 900) p.life -= 0.03;
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.scale(1, Math.abs(Math.cos(p.sway * 1.3)) * 0.8 + 0.2);
          ctx.fillStyle = p.back ? '#c3321f' : '#f1e7cf';
          ctx.fillRect(-p.w / 2, -p.w * 0.8, p.w, p.w * 1.6);
          ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.6; ctx.strokeRect(-p.w / 2, -p.w * 0.8, p.w, p.w * 1.6);
          if (!p.back) { ctx.fillStyle = '#c8321e'; ctx.beginPath(); ctx.arc(0, -p.w * 0.2, p.w * 0.22, 0, 6.28); ctx.fill(); }
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
      if (t < total) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
    };
    requestAnimationFrame(step);
  }

  /* ───────── 시트(종이) ───────── */
  function openSheet(html, opts = {}) {
    clearTimers();
    const bd = $('#backdrop'), sh = $('#sheet');
    const keepScroll = opts.noFocus ? sh.scrollTop : 0;
    sh.innerHTML = html;
    bd.hidden = false;
    sheetKind = opts.kind || 'other';
    sh.dataset.dismiss = opts.dismiss === false ? 'no' : 'yes';
    bd.onclick = (e) => { if (e.target === bd && opts.dismiss !== false) { closeSheet(); resume(); } };
    if (opts.noFocus) { sh.scrollTop = keepScroll; return sh; }
    const focusable = sh.querySelector('[data-autofocus]') || sh.querySelector('button, input');
    if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 30);
    return sh;
  }
  function closeSheet() { $('#backdrop').hidden = true; $('#sheet').innerHTML = ''; sheetKind = null; }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#backdrop').hidden && $('#sheet').dataset.dismiss !== 'no') { closeSheet(); resume(); }
  });

  function rulesHTML(r) {
    r = r || (G ? G.rules : S.rules);
    return `<div class="rules">
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">規</span><div><h2 id="sheetTitle">나일롱뽕 규칙</h2><p class="lede">손에 남은 패 숫자의 합이 작을수록 이기는 화투 놀이</p></div></div>
      <h3>목표</h3><p>1월 패는 1점, 12월 패는 12점. 판이 끝날 때 손에 든 패의 합만큼 점수를 받아요. 정한 판 수를 다 하고 누적 점수가 가장 낮은 사람이 1등이에요.</p>
      <h3>시작</h3><p>선은 6장, 나머지는 5장을 받아요. 남은 패는 더미로 쌓고 맨 윗장을 뒤집어 버림패 자리에 둡니다(이 패로는 뽕할 수 없어요). 선은 첫 차례에 한 장 버리기만 해요.</p>
      <h3>차례</h3><p>더미에서 한 장 가져오고 한 장 버려요. 차례는 반시계 방향이라 내 오른쪽 사람이 다음이에요.</p>
      <h3>뽕</h3><p>누가 버린 패와 같은 월을 2장 갖고 있으면 차례와 상관없이 뽕을 칠 수 있어요. 2장을 버림패 위에 내려놓고 남은 3장 중 1장을 버려요. 그러면 손에 2장만 남고, 다음 차례는 뽕한 사람의 오른쪽 사람이에요.</p>
      ${r.battle ? '<h3>전투모드</h3><p>뽕을 기다려 주지 않아요. 패가 버려지면 바로 다음 사람 차례로 넘어가고, 다음 사람이 더미에서 패를 가져가기(또는 스톱하기) 전에 <b>뽕!</b>을 먼저 눌러야 뽕이 돼요. 늦으면 기회가 사라져요. 박·자연바가지는 자동으로 돼요. 버린 직후 0.7초는 다음 사람이 가져갈 수 없어요.</p>' : ''}
      <h3>박</h3><p>뽕하고 남은 2장이 같은 월인데 그 월이 또 버려지면 한 번 더 뽕, 이게 박이에요. 패를 다 털고 0점으로 이기고, 그 패를 버린 사람은 바가지를 써서 손패 합에 ${r.bagaji}점을 더 받아요.</p>
      <h3>자연뽕 · 자연바가지</h3><p>손에 같은 월 3장을 쥔 것이 자연뽕이에요. 자연뽕에 나머지 2장이 같은 월일 때 그 월이 버려져 뽕하면 패를 다 턴 것으로 쳐서 0점으로 이기고, 버린 사람은 바가지예요. ${r.jayeon42 !== false ? '자연뽕 월의 남은 1장이 버려져서 같은 월 4장 + 나머지 2장(4-2)이 돼도 자연바가지예요.' : '이 판에서는 자연뽕 월의 남은 1장이 버려지면(4-2) 일반 뽕이에요.'} ${r.naturalFree ? '스톱이나 더미가 떨어졌을 때 손에 쥔 자연뽕 3장은 점수에서 빼 줘요.' : '이 판에서는 자연뽕 3장도 점수에 그대로 세요.'}</p>
      <h3>스톱</h3><p>손패 합이 ${r.stopLimit} 이하면 내 차례에 패를 가져오는 대신 스톱을 외칠 수 있어요. 모두 패를 공개해서 내가 가장 낮으면 0점, 아니면(같은 점수가 있어도) 손패 합에 ${r.stopPenalty}점을 더 받아요.</p>
      <h3>족보</h3><p>6장을 쥐었을 때(선의 첫 패, 또는 한 장 가져온 직후) 아래 조합이면 바로 공개해서 판을 끝낼 수 있어요. 나머지 사람은 손패 합만큼 받아요.</p>
      <table><thead><tr><th>족보</th><th>조건</th><th>점수</th></tr></thead><tbody>
        <tr><td>또이또이</td><td>같은 숫자 3장씩 두 묶음, 또는 2장씩 세 묶음</td><td>0</td></tr>
        <tr><td>스트레이트</td><td>6장이 모두 이어진 숫자 (1–6부터 7–12까지)</td><td>−합<br>(−21~−57)</td></tr>
        <tr><td>10 부족</td><td>합 10 이하</td><td>−100</td></tr>
        <tr><td>60 이상</td><td>합 60 이상</td><td>−100</td></tr>
        <tr><td>총통</td><td>${r.chongtongStrict ? '같은 숫자 4장 + 나머지 2장도 같은 숫자 (4-2)' : '같은 숫자 4장'}</td><td>−100</td></tr>
      </tbody></table>
      <h3>더미가 떨어지면</h3><p>모두 손패 합만큼 점수를 받아요.</p>
      <h3>다음 판</h3><p>이번 판 점수가 가장 낮은 사람이 선을 잡아요.</p>
      <p class="src">규칙은 <a href="https://namu.wiki/w/%EB%82%98%EC%9D%B4%EB%A1%B1%EB%BD%95" target="_blank" rel="noopener">나무위키 ‘나이롱뽕’</a> 문서를 따랐어요. 지역마다 다른 규칙은 새 게임의 ‘지역 규칙’에서 바꿀 수 있어요.</p>
      <div class="sheet-actions"><button class="btn primary" type="button" data-close data-autofocus>닫기</button></div>
    </div>`;
  }
  function showRules() {

  function seg(name, options, value) {

        <div class="field"><span class="field-label">총통 인정</span>${seg('chong', [['any', '4장이면 인정'], ['strict', '4-2만 인정']], r.chongtongStrict ? 'strict' : 'any')}</div>

      </section>
      <section data-pane="solo"${mode === 'solo' ? '' : ' hidden'}>
        <div class="field"><span class="field-label">함께할 컴퓨터</span>${seg('cpu', [[1, '1명'], [2, '2명'], [3, '3명']], S.cpu)}</div>
        <div class="field"><span class="field-label">판 수</span>${seg('rounds', [[3, '3판'], [5, '5판'], [10, '10판']], S.rounds)}</div>

        </div>
      </section>
      <div class="sheet-actions" style="margin-top:8px"><button class="btn" type="button" data-rules>규칙 보기</button>${SERVER ? '<button class="btn" type="button" data-ranking>랭킹</button><button class="btn" type="button" data-feedback>의견 보내기</button>' : ''}</div>

    const fbb = sh.querySelector('[data-feedback]');

    }));
    sh.querySelector('[data-start]').onclick = () => {

      Sound.unlock();
      closeSheet();

    };
    const res = sh.querySelector('[data-resume]');
    if (res) res.onclick = () => {
      Sound.unlock();
      if (stored) { G = stored; preview = false; gen += 1; shownFor = null; }
      closeSheet();
      resume();
    };
    sh.querySelector('[data-rules]').onclick = () => {
      const s2 = openSheet(rulesHTML(S.rules), { kind: 'rules' });
      s2.querySelector('[data-close]').textContent = '돌아가기';
      s2.querySelector('[data-close]').onclick = () => showStart();
    };
    if (SERVER) {
      const nick = sh.querySelector('#nick'), code = sh.querySelector('#roomCode');
      const note = (msg) => { const n = sh.querySelector('[data-notice]'); n.textContent = msg; n.hidden = !msg; };
      nick.addEventListener('change', () => setMyName(cleanNick(nick.value)));
      code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); });
      const go = async (kind) => {
        const name = cleanNick(nick.value);
        if (!name) { note('닉네임을 먼저 정해 주세요. 다른 사람에게 이 이름으로 보여요'); nick.focus(); return; }
        if (kind === 'join' && !/^\d{6}$/.test(code.value)) { note('방 번호 6자리를 넣어 주세요'); code.focus(); return; }
        setMyName(name);

        note('');

        if (st.waitingPlayers) parts.push(`지금 기다리는 사람 ${st.waitingPlayers}명`);

      }).catch(() => {});
    }

  function tallyHTML(res) {
    const order = [];
    for (let k = 0; k < G.players.length; k++) order.push(k);
    order.sort((a, b) => res.scores[a] - res.scores[b] || a - b);
    return `<ol class="tally">${order.map((i) => {
      const pl = G.players[i];
      const hand = res.hands[i].slice().sort((a, b) => a - b);
      const notes = res.notes[i].map((t) => `<span class="note">${t}</span>`).join(' ');
      const melds = res.melds[i].map((m) => `<span class="meld-tag">뽕 ${M(m[0])}월</span>`).join('');
      const sc = res.scores[i];
      return `<li class="${i === res.best ? 'win' : ''}">
        <div class="who">${avatarHTML(i)}<span class="name">${esc(pl.name)}</span>${notes}</div>
        <div class="cards" data-cards="${hand.join(',')}">${melds}${hand.length ? '' : '<span class="empty-hand">패를 다 털었어요</span>'}</div>
        <div class="num round"><small>이번 판</small>${sc > 0 ? '+' + sc : sc}</div>
        <div class="num total"><small>누적</small>${res.cumulative[i]}</div>
        <div class="sum">손패 합 ${res.totals[i]}</div>
      </li>`;
    }).join('')}</ol>`;
  }
  function fillTallyCards(sh) {
    sh.querySelectorAll('.cards[data-cards]').forEach((box) => {
      const ids = box.dataset.cards ? box.dataset.cards.split(',').map(Number) : [];

  }
  function headline(res) {
    const n = (i) => (i === HUMAN ? '내' : esc(G.players[i].name));
    switch (res.kind) {
      case 'bak': return [res.p === HUMAN ? '박! 패를 다 털었어요' : `${n(res.p)} 박!`,`${res.from === HUMAN ? '내가' : subj(res.from)} 버린 패로 패를 다 털었어요. ${res.from === HUMAN ? '내가' : subj(res.from)} 바가지를 썼어요.`, '박'];
      case 'jayeon': return [`${n(res.p)} 자연바가지!`, `자연뽕을 쥐고 남은 짝으로 뽕해서 바로 이겼어요. ${res.from === HUMAN ? '내가' : subj(res.from)} 바가지를 썼어요.`, '뽕'];
      case 'stop': return res.success
        ? [`${n(res.p)} 스톱 성공`, `손패 합 ${res.totals[res.p]}로 가장 낮아서 0점이에요.`, '止']
        : [`${n(res.p)} 스톱 실패`, `더 낮거나 같은 사람이 있어서 손패 합에 ${G.rules.stopPenalty}점을 더 받아요.`, '止'];
      case 'jokbo': return [`${n(res.p)} 족보 — ${res.jokbo.name}`, `${res.jokbo.all.join(' · ')} → ${res.jokbo.score}점`, '譜'];
      default: return ['더미가 다 떨어졌어요', '모두 손패 합만큼 점수를 받아요.', '終'];
    }
  }
  function showRoundSheet(refresh) {
    if (!G || !G.result || G.phase !== 'roundEnd') return;

  function scoreTableHTML() {

  function showScores(fromRound) {

    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">點</span><div><h2 id="sheetTitle">점수표</h2><p class="lede">${G.rounds}판 중 ${G.history.length}판 끝 · 낮을수록 좋아요</p></div></div>
