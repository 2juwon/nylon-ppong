    const si = online && G && G.players[i] ? G.players[i].seatInfo : null;
    if (!si) return '';
    if (si.kind === 'ai') return '<span class="tag">컴퓨터</span>';
    if (!si.online) return '<span class="tag off">끊김</span>';
    if (si.away) return '<span class="tag off">자리 비움</span>';
    return '';
  }
  // 사람들과 할 때: 남은 시간 막대
  function timerBar() {
    if (!online || !online.room || !online.room.deadline || !G) return null;
    const left = online.room.deadline - (Date.now() + online.skew);
    if (left <= 0) return null;
    const total = G.phase === 'claim' ? 10000 : G.phase === 'roundEnd' ? 30000 : 25000;
    const b = el('span', 'tbar' + (left < 6000 ? ' hot' : ''), '<i></i>');
    b.style.setProperty('--t', Math.round(left) + 'ms');
    b.style.setProperty('--from', Math.min(1, left / total).toFixed(3));
    return b;
  }
  function meldChip(meld) {
    const w = el('span', 'meld');
    w.appendChild(makeCard(meld[0]));
    w.appendChild(document.createTextNode('×3'));
    w.title = `${M(meld[0])}월 뽕`;
    return w;
  }

  function render(opt = {}) {
    if (!G) return;
    const actor = ['draw', 'discard', 'claim'].includes(G.phase) ? NP.actorOf(G) : -1;
    $('#roundChip').textContent = online ? (preview ? `방 ${online.code}` : `${G.round}/${G.rounds}판 · 방 ${online.code}`) : `${G.round} / ${G.rounds}판`;

    // 상대 자리
    const seats = $('#seats');
    seats.style.setProperty('--opp', G.players.length - 1);
    seats.innerHTML = '';
    for (const i of seatOrder()) {
      const pl = G.players[i];
      const s = el('div', 'seat' + (actor === i && !preview ? ' turn' : ''));
      s.dataset.p = i;
      const head = el('div', 'who');
      head.innerHTML = `${avatarHTML(i)}<span class="name">${esc(pl.name)}</span>${G.dealer === i ? '<span class="sun" title="선">선</span>' : ''}${seatTag(i)}`;
      s.appendChild(head);
      const row = el('div', 'seat-row');
      const minis = el('div', 'minis');
      let count = opt.hideHands ? 0 : pl.hand.length;
      if (opt.seatIncoming === i) count = Math.max(0, count - 1);
      for (let k = 0; k < count; k++) minis.appendChild(el('span', 'mini'));
      minis.setAttribute('aria-label', `손패 ${pl.hand.length}장`);
      if (!opt.hideHands && !pl.hand.length) minis.appendChild(el('span', 'out-tag', '다 털었음'));
      row.appendChild(minis);
      row.appendChild(el('span', 'seat-score', `${pl.score}점`)).title = '누적 점수';
      s.appendChild(row);
      if (pl.melds.length) {
        const md = el('div', 'melds');
        pl.melds.forEach((m) => md.appendChild(meldChip(m)));
        s.appendChild(md);
      }
      if (actor === i && !preview) {
        s.insertAdjacentHTML('beforeend', '<span class="thinking" aria-label="생각 중"><i></i><i></i><i></i></span>');
        const tb = timerBar();
        if (tb) s.appendChild(tb);
      }
      seats.appendChild(s);
    }

    // 더미
    const deck = $('#deck');
    deck.innerHTML = '';
    const dn = opt.hidePile ? G.deck.length + 1 : G.deck.length;
    const layers = Math.min(3, dn);
    for (let k = layers - 1; k >= 0; k--) {
      const b = makeBack();
      b.style.transform = `translate(${-k * 2}px, ${-k * 2}px)`;
      deck.appendChild(b);
    }
    if (!dn) deck.innerHTML = '<span class="pile-empty"></span>';
    const myDraw = !preview && G.phase === 'draw' && G.turn === HUMAN && !busy;
    deck.classList.toggle('can', myDraw);
    deck.setAttribute('aria-label', `더미 ${dn}장${myDraw ? ', 눌러서 한 장 가져오기' : ''}`);
    deck.tabIndex = myDraw ? 0 : -1;
    $('#deckLabel').textContent = `더미 ${dn}장`;

    // 버림패
    const pile = $('#pile');
    pile.innerHTML = '<span class="pile-empty"></span>';
    const shown = opt.hidePile ? [] : G.pile.slice(-3);
    shown.forEach((e, k) => {
      const c = makeCard(e.card);
      const top = k === shown.length - 1;
      const depth = shown.length - 1 - k;
      const jitter = ((e.card * 37) % 11) - 5;
      c.style.transform = top ? 'rotate(0deg)' : `translate(${depth * -5 + jitter * 0.4}px, ${depth * -3}px) rotate(${jitter * 1.4}deg)`;
      if (opt.pileHidden && opt.pileHidden.includes(e.card)) c.classList.add('incoming');
      if (top) c.classList.add('top');
      pile.appendChild(c);
    });
    const topE = G.pile[G.pile.length - 1];
    let cap = '';
    if (!opt.hidePile && topE) {
      if (topE.by < 0) cap = '처음 뒤집은 패';
      else if (topE.kind === 'meld') cap = topE.by === HUMAN ? '내가 뽕' : `${nameOf(topE.by)} 뽕`;
      else cap = topE.by === HUMAN ? '내가 버림' : `${nameOf(topE.by)} 버림`;
    }
    $('#pileLabel').textContent = cap;
    const iCanClaim = G.phase === 'claim' && G.claim && G.claim.p === HUMAN && !preview;
    pile.classList.toggle('claimable', iCanClaim);

    // 나온 패
    const seen = new Array(13).fill(0), mine = new Array(13).fill(0);
    if (!opt.hidePile) G.pile.forEach((e) => { if (!(opt.pileHidden && opt.pileHidden.includes(e.card))) seen[M(e.card)]++; });
    if (!opt.hideHands && !preview) G.players[HUMAN].hand.forEach((c) => { if (c !== opt.incoming) mine[M(c)]++; });
    const tr = $('#tracker');
    tr.innerHTML = '';
    for (let m = 1; m <= 12; m++) {
      const cell = el('div', 'tk' + (seen[m] + mine[m] >= 3 ? ' dead' : ''));
      let pips = '';
      for (let k = 0; k < 4; k++) pips += `<i class="pip${k < seen[m] ? ' seen' : k < seen[m] + mine[m] ? ' mine' : ''}"></i>`;
      cell.innerHTML = `<b>${m}</b><span class="pips">${pips}</span>`;
      cell.title = `${m}월 ${MONTHS[m]} · 나온 패 ${seen[m]}장, 내 손 ${mine[m]}장`;
      tr.appendChild(cell);
    }

    // 내 자리
    const me = G.players[HUMAN];
    const meEl = $('#me');
    meEl.classList.toggle('turn', actor === HUMAN && !preview);
    meEl.querySelectorAll(':scope > .tbar').forEach((n) => n.remove());
    if (actor === HUMAN && !preview) { const tb = timerBar(); if (tb) meEl.appendChild(tb); }
    const total = NP.handTotal(me.hand, G.rules);
    $('#meHead').innerHTML = `${avatarHTML(HUMAN)}<span class="name" style="font-weight:700">나</span>${G.dealer === HUMAN ? '<span class="sun" title="선">선</span>' : ''}` +
      `${me.melds.length ? `<span class="melds" id="myMelds"></span>` : ''}` +
      `<span class="stat">손패 합<b>${opt.hideHands || preview ? '–' : total}</b></span><span class="stat">누적<b>${me.score}</b></span>`;
    if (me.melds.length) { const md = $('#myMelds'); me.melds.forEach((m) => md.appendChild(meldChip(m))); }

    const hand = $('#hand');
    hand.innerHTML = '';
    const canPick = !preview && G.phase === 'discard' && G.turn === HUMAN;
    hand.classList.toggle('pick', canPick);
    if (!opt.hideHands) {
      const sorted = me.hand.slice().sort((a, b) => a - b);
      const claimM = iCanClaim ? M(G.claim.card) : 0;
      let matched = 0;
      for (const id of sorted) {
        const c = preview ? makeBack() : makeCard(id, 'button');
        if (!preview) {
          if (id === opt.incoming) c.classList.add('incoming');
          if (opt.hiddenCards && opt.hiddenCards.includes(id)) c.classList.add('incoming');
          if (canPick && selected === id) c.classList.add('sel');
          if (claimM && M(id) === claimM && matched < 2) { c.classList.add('match'); matched++; }
          c.tabIndex = canPick ? 0 : -1;
          c.addEventListener('click', () => onCardClick(id));
        }
        hand.appendChild(c);
      }
    }
    if (canPick && selected != null && !me.hand.includes(selected)) selected = null;
    renderActions();
  }

  function btn(label, cls, onClick, sub) {
    const b = el('button', 'btn ' + (cls || ''));
    b.type = 'button';
    b.innerHTML = label + (sub ? ` <small>${sub}</small>` : '');
    b.addEventListener('click', onClick);
    return b;
  }

  function renderActions() {
    const box = $('#actions');
    box.innerHTML = '';
    box.classList.toggle('wait', !!(online && busy && !dealing));
    if (!G || preview || dealing) return;
    const me = G.players[HUMAN];
    if (G.phase === 'roundEnd') { box.appendChild(btn('점수표 보기', '', () => showRoundSheet())); return; }
    if (G.phase === 'gameEnd') { box.appendChild(btn('최종 결과', 'gold', () => showGameEnd())); return; }
    const actor = NP.actorOf(G);
    if (actor == null || actor < 0) { box.appendChild(el('p', 'hint', '잠시만요…')); return; }
    if (actor !== HUMAN) {
      box.appendChild(el('p', 'hint', `${nameOf(actor)} 차례예요`));
      return;
    }
    const clock = online ? ' · <span class="clock" data-clock></span>' : '';
    if (G.phase === 'draw') {
      box.appendChild(btn('한 장 가져오기', 'primary', () => act({ type: 'draw', p: HUMAN })));
      if (NP.canStop(G, HUMAN)) {
        box.appendChild(btn('스톱', 'gold', () => act({ type: 'stop', p: HUMAN }), `합 ${NP.handTotal(me.hand, G.rules)}`));
      }
    } else if (G.phase === 'discard') {
      const jk = me.hand.length === 6 ? NP.findJokbo(me.hand, G.rules) : null;
      if (jk) box.appendChild(btn(`족보! ${jk.name}`, 'gold', () => act({ type: 'declare', p: HUMAN }), `${jk.score > 0 ? '+' : ''}${jk.score}점`));
      if (selected != null && me.hand.includes(selected)) {
        box.appendChild(btn(`${M(selected)}월 버리기`, 'primary', () => act({ type: 'discard', p: HUMAN, card: selected })));
      } else {
        box.appendChild(el('p', 'hint', (me.hand.length === 3 && me.drawsSinceMeld === 0 ? '뽕 했어요. 남은 3장 중 버릴 패를 고르세요' : '버릴 패를 골라 주세요 · 두 번 누르면 바로 버려요') + clock));
      }
    } else if (G.phase === 'claim' && G.claim && G.claim.p === HUMAN) {
      const k = G.claim.kind;
      const label = k === 'bak' ? '박!' : k === 'jayeon' ? '자연바가지!' : '뽕!';
      const sub = k === 'ppong' ? `${M(G.claim.card)}월 2장 내려놓기` : '패를 다 털고 0점';
      box.appendChild(btn(label, 'primary shout', () => act({ type: 'claim', p: HUMAN }), ''));
      box.appendChild(btn('넘기기', '', () => act({ type: 'pass', p: HUMAN })));
      box.insertAdjacentHTML('beforeend', `<p class="hint" style="flex-basis:100%">${sub}${clock}</p>`);
    }
    if (online && G.phase === 'draw') box.insertAdjacentHTML('beforeend', `<p class="hint" style="flex-basis:100%">남은 시간<span class="clock" data-clock style="margin-left:4px"></span></p>`);
  }

  function say(html) {
    lastLine = html;
    $('#msg').innerHTML = html;
  }

  /* ───────── 움직임 ───────── */
  function rectOf(node) { return node ? node.getBoundingClientRect() : null; }
  function seatHandRect(i) {
    const seat = document.querySelector(`.seat[data-p="${i}"]`);
    if (!seat) return null;
    const minis = seat.querySelectorAll('.mini');
    const last = minis[minis.length - 1];
    if (last) return rectOf(last);
    const r = rectOf(seat.querySelector('.minis'));
    return r ? new DOMRect(r.left, r.top, 14, 22) : rectOf(seat);
  }
  function anchorRect(i) {
    if (i === HUMAN) return rectOf($('#hand'));
    return rectOf(document.querySelector(`.seat[data-p="${i}"]`));
  }
  function fly(card, from, to, o = {}) {
    if (!from || !to || T(100) === 0) return Promise.resolve();
    const g = card == null ? makeBack('ghost') : makeCard(card, 'div', 'ghost');
    g.style.setProperty('--w', to.width + 'px');
    g.style.left = to.left + 'px';
    g.style.top = to.top + 'px';
    $('#fx').appendChild(g);
    const sx = from.width / to.width, sy = from.height / to.height;
    const dx = from.left - to.left, dy = from.top - to.top;
    const a = g.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy}) rotate(${o.spin || 0}deg)` },
      { transform: 'translate(0, 0) scale(1, 1) rotate(0deg)' },
    ], { duration: o.dur != null ? o.dur : T(320), delay: o.delay || 0, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'both' });
    return a.finished.then(() => g.remove(), () => g.remove());
  }
  function stamp(text, rect, sub) {
    if (!rect) return;
    const s = el('div', 'stamp', text + (sub ? `<small>${sub}</small>` : ''));
    s.style.left = rect.left + rect.width / 2 + 'px';
    s.style.top = rect.top + rect.height / 2 + 'px';
    $('#fx').appendChild(s);
    setTimeout(() => s.classList.add('out'), Math.max(900, T(1300)));
    setTimeout(() => s.remove(), Math.max(1300, T(1700)));
  }
  function shake() {
    if (reduceMotion) return;
    $('#felt').animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-4px,1px)' }, { transform: 'translate(4px,-1px)' }, { transform: 'translate(-2px,0)' }, { transform: 'translate(0,0)' }], { duration: 260 });
  }

  /* ───────── 진행 ───────── */
  function snapshotFrom(a, ev) {
    const out = {};
    if (a.type === 'draw') out.deck = rectOf($('#deck .card:last-child')) || rectOf($('#deck'));
    if (a.type === 'discard') {
      out.src = a.p === HUMAN ? rectOf(document.querySelector(`#hand .card[data-id="${a.card}"]`)) : seatHandRect(a.p);
    }
    if (a.type === 'claim') {
      const ce = ev && ev.find((e) => e.t === 'claim');
      let used = ce ? ce.used : null;
      if (!used) { const m = M(G.claim.card); used = G.players[a.p].hand.filter((x) => M(x) === m).slice(0, 2); }
      out.srcs = used.map((id) => (a.p === HUMAN ? rectOf(document.querySelector(`#hand .card[data-id="${id}"]`)) : seatHandRect(a.p)));
    }
    return out;
  }

  let actGuard = null;
  async function act(a) {
    if (busy || !G || preview) return;
    if (a.p === HUMAN) Sound.unlock();
    if (online) { // 사람들과 할 때는 서버에 보내고 결과를 기다림
      if (a.type === 'next') { Net.send({ t: 'ready' }); return; }
      if (!Net.send({ t: 'act', type: a.type, card: a.card })) { say('연결이 끊겼어요. 다시 연결하는 중이에요'); return; }
      busy = true;
      renderActions();
      clearTimeout(actGuard);
      actGuard = setTimeout(() => { if (busy && online) { busy = false; render(); } }, 5000);
      return;
    }
    const g0 = gen;
    busy = true;
    clearTimers();
    let ev = [];
    try {
      const from = snapshotFrom(a);
      ev = NP.apply(G, a);
      if (a.type === 'discard' || a.type === 'claim' || a.type === 'pass') selected = null;
      saveStore();
      await present(a, ev, from);
    } catch (err) {
      console.error(err);
      if (gen === g0) say('그 행동은 지금 할 수 없어요');
    }
    if (gen !== g0) return; // 그사이 새 게임이 시작됨
    busy = false;
    render();
    saveStore();
    tick();
  }
  const resume = () => { if (G && !preview && !busy) { render(); tick(); } };

  async function present(a, ev, from) {
    const p = a.p;
    switch (a.type) {
      case 'draw': {
        const card = ev[0].card;
        if (p === HUMAN) {
          render({ incoming: card });
          const to = rectOf(document.querySelector(`#hand .card[data-id="${card}"]`));
          Sound.swish();
          await fly(card, from.deck, to, { spin: -6 });
          say(`${monthObj(card)} 가져왔어요. 버릴 패를 고르세요`);
        } else {
          render({ seatIncoming: p });
          Sound.swish();
          // 상대 자리의 맨 끝 자리로
          const seat = document.querySelector(`.seat[data-p="${p}"] .minis`);
          const lastMini = seat && seat.lastElementChild;
          const r = lastMini ? rectOf(lastMini) : seatHandRect(p);
          const to = r ? new DOMRect(r.left + (lastMini ? 8 : 0), r.top, 14, 22) : null;
          await fly(null, from.deck, to);
          say(`${nameOf(p)} 차례 — 한 장 가져갔어요`);
        }
        break;
      }
      case 'discard': {
        render({ pileHidden: [a.card] });
        const top = rectOf($('#pile .card.top'));
        await fly(a.card, from.src, top, { spin: 8 });
        $('#pile .card.top') && $('#pile .card.top').classList.remove('incoming');
        Sound.tak();
        const who = p === HUMAN ? `${monthObj(a.card)} 버렸어요` : `${subj(p)} <em>${monthObj(a.card)}</em> 버렸어요`;
        const chance = ev.find((e) => e.t === 'claimChance');
        if (chance && chance.p === HUMAN) {
          say(`${who} — <em>${chance.kind === 'ppong' ? '뽕' : chance.kind === 'bak' ? '박' : '자연바가지'}</em> 할 수 있어요!`);
          Sound.ping();
        } else if (ev.some((e) => e.t === 'exhaust')) {
          say(`${who} 더미가 다 떨어졌어요`);
        } else {
          say(who);
        }
        break;
      }
      case 'claim': {
        const e = ev.find((x) => x.t === 'claim');
        const label = e.kind === 'bak' ? '박!' : e.kind === 'jayeon' ? '자연바가지!' : '뽕!';
        stamp(label, anchorRect(p), p === HUMAN ? '' : nameOf(p));
        Sound.slam();
        shake();
        render({ pileHidden: e.used, hiddenCards: [] });
        const cards = $('#pile').querySelectorAll('.card');
        const targets = Array.from(cards).slice(-2).map(rectOf);
        await Promise.all(e.used.map((id, k) => fly(id, from.srcs[k], targets[k], { delay: k * T(70), spin: k ? 10 : -10 })));
        render();
        if (e.kind === 'ppong') {
          say(p === HUMAN ? `<em>뽕!</em> ${M(e.card)}월 세 장을 내려놨어요. 한 장 버리세요` : `${nameOf(p)} <em>뽕!</em> ${M(e.card)}월 세 장`);
        } else {
          say(`${nameOf(p)} <em>${label}</em> 패를 다 털었어요`);
        }
        await wait(T(450));
        break;
      }
      case 'pass':
        render();
        say('넘겼어요');
        break;
      case 'stop': {
        stamp('스톱!', anchorRect(p), p === HUMAN ? '' : nameOf(p));
        Sound.slam();
        shake();
        say(`${p === HUMAN ? '' : nameOf(p) + ' '}<em>스톱!</em> 모두 패를 공개해요`);
        render();
        await wait(Math.max(700, T(900)));
        break;
      }
      case 'declare': {
        const e = ev.find((x) => x.t === 'declare');
        stamp('족보!', anchorRect(p), e.jokbo.name);
        Sound.slam();
        say(`${p === HUMAN ? '' : nameOf(p) + ' '}<em>족보 — ${e.jokbo.name}</em>`);
        render();
        await wait(Math.max(800, T(1000)));
        break;
      }
      case 'start':
      case 'next': {
        await dealAnimation();
        break;
      }
      case 'wait':
        render();
        break;
    }
  }

  async function dealAnimation() {
    const n = G.players.length, d = G.dealer;
    dealing = true;
    try { await dealFly(n, d); } finally { dealing = false; }
    render();
    say(G.dealer === HUMAN ? '내가 선이에요. 6장 중 한 장을 버리며 시작해요' : `${subj(G.dealer)} 선이에요`);
  }
  async function dealFly(n, d) {
    const g0 = gen;
    render({ hideHands: true, hidePile: true });
    say(`${G.round}판 — ${G.dealer === HUMAN ? '내가' : subj(G.dealer)} 선이에요`);
    if (T(100) > 0) {
      const deckR = rectOf($('#deck .card:last-child')) || rectOf($('#deck'));
      const handR = rectOf($('#hand'));
      const hw = parseFloat(getComputedStyle($('#hand')).getPropertyValue('--hand-w')) || 52;
      const target = (i) => {
        if (i === HUMAN) return new DOMRect(handR.left + handR.width / 2 - hw / 2, handR.top + 14, hw, hw * 1.6);
        const r = rectOf(document.querySelector(`.seat[data-p="${i}"] .minis`));
        return r ? new DOMRect(r.left + 10, r.top, 14, 22) : null;
      };
      const seq = [];
      const order = [];
      for (let k = 0; k < n; k++) order.push((d + k) % n);
      order.forEach((i) => { for (let c = 0; c < 3; c++) seq.push(i); });
      order.forEach((i) => { for (let c = 0; c < (i === d ? 3 : 2); c++) seq.push(i); });
      const gap = T(48);
      seq.forEach((_, k) => setTimeout(() => Sound.tick(), k * gap));
      await Promise.all(seq.map((i, k) => fly(null, deckR, target(i), { delay: k * gap, dur: T(260) })));
      if (gen !== g0) return;
      render({ hidePile: true });
      const pileR = rectOf($('#pile'));
      await fly(G.pile[0].card, deckR, pileR, { dur: T(300), spin: 12 });
      Sound.tak();
    }
  }

  const resultKey = () => `${online ? 'o' + online.gen : gen}:${G.history.length}`;
  const endKey = () => (online ? 'end:o' + online.gen : 'end:' + gen);
  function tick() {
    clearTimers();
    if (online) { onlineAfter(); return; } // 사람들과 할 때는 서버가 진행
    if (!G || preview || busy) return;
    if (!$('#backdrop').hidden) return; // 시트를 보는 동안은 컴퓨터도 기다림
    if (G.phase === 'roundEnd') { if (shownFor !== resultKey()) later(showRoundSheet, Math.max(500, T(700))); return; }
    if (G.phase === 'gameEnd') { if (shownFor !== endKey()) showGameEnd(); return; }
    const actor = NP.actorOf(G);
    if (actor < 0) return;
    if (G.players[actor].kind === 'human') {
      if (G.phase === 'draw') say(NP.canStop(G, HUMAN) ? `내 차례 — 한 장 가져오거나 <em>스톱</em>할 수 있어요` : '내 차례 — 더미에서 한 장 가져오세요');
      return;
    }
    const view = NP.viewFor(G, actor);
    const a = NPAI.decide(view, G.players[actor].persona, Math.random);
    if (!a) return;
    const delay = G.phase === 'claim' ? T(380) : a.type === 'discard' ? T(520) : T(480);
    later(() => act(a), delay);
  }

  function onCardClick(id) {
    if (busy || !G || G.phase !== 'discard' || G.turn !== HUMAN) return;
    Sound.unlock();
    if (selected === id) { act({ type: 'discard', p: HUMAN, card: id }); return; }
    selected = id;
    render();
    const b = $('#actions .btn.primary');
    if (b) b.focus({ preventScroll: true });
  }

  /* ───────── 시트(종이) ───────── */
  function openSheet(html, opts = {}) {
    clearTimers();
    const bd = $('#backdrop'), sh = $('#sheet');
    const keepScroll = opts.noFocus ? sh.scrollTop : 0;
    sh.innerHTML = html;
    bd.hidden = false;
    sheetKind = opts.kind || 'other';
    sh.dataset.dismiss = opts.dismiss === false ? 'no' : 'yes';
    bd.onclick = (e) => { if (e.target === bd && opts.dismiss !== false) { closeSheet(); resume(); } };
    if (opts.noFocus) { sh.scrollTop = keepScroll; return sh; }
    const focusable = sh.querySelector('[data-autofocus]') || sh.querySelector('button, input');
    if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 30);
    return sh;
  }
  function closeSheet() { $('#backdrop').hidden = true; $('#sheet').innerHTML = ''; sheetKind = null; }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#backdrop').hidden && $('#sheet').dataset.dismiss !== 'no') { closeSheet(); resume(); }
  });

  function rulesHTML(r) {
    r = r || (G ? G.rules : S.rules);
    return `<div class="rules">
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">規</span><div><h2 id="sheetTitle">나일롱뽕 규칙</h2><p class="lede">손에 남은 패 숫자의 합이 작을수록 이기는 화투 놀이</p></div></div>
      <h3>목표</h3><p>1월 패는 1점, 12월 패는 12점. 판이 끝날 때 손에 든 패의 합만큼 점수를 받아요. 정한 판 수를 다 하고 누적 점수가 가장 낮은 사람이 1등이에요.</p>
      <h3>시작</h3><p>선은 6장, 나머지는 5장을 받아요. 남은 패는 더미로 쌓고 맨 윗장을 뒤집어 버림패 자리에 둡니다(이 패로는 뽕할 수 없어요). 선은 첫 차례에 한 장 버리기만 해요.</p>
      <h3>차례</h3><p>더미에서 한 장 가져오고 한 장 버려요. 차례는 반시계 방향이라 내 오른쪽 사람이 다음이에요.</p>
      <h3>뽕</h3><p>누가 버린 패와 같은 월을 2장 갖고 있으면 차례와 상관없이 뽕을 칠 수 있어요. 2장을 버림패 위에 내려놓고 남은 3장 중 1장을 버려요. 그러면 손에 2장만 남고, 다음 차례는 뽕한 사람의 오른쪽 사람이에요.</p>
      <h3>박</h3><p>뽕하고 남은 2장이 같은 월인데 그 월이 또 버려지면 한 번 더 뽕, 이게 박이에요. 패를 다 털고 0점으로 이기고, 그 패를 버린 사람은 바가지를 써서 손패 합에 ${r.bagaji}점을 더 받아요.</p>
      <h3>자연뽕 · 자연바가지</h3><p>손에 같은 월 3장을 쥔 것이 자연뽕이에요. 자연뽕에 나머지 2장이 같은 월일 때 그 월이 버려져 뽕하면 패를 다 턴 것으로 쳐서 0점으로 이기고, 버린 사람은 바가지예요. ${r.naturalFree ? '이 판에서는 하우스 룰로 자연뽕 3장을 점수에서 빼 줘요.' : '스톱이나 더미가 떨어졌을 때 자연뽕은 점수에서 빼 주지 않아요.'}</p>
      <h3>스톱</h3><p>손패 합이 ${r.stopLimit} 이하면 내 차례에 패를 가져오는 대신 스톱을 외칠 수 있어요. 모두 패를 공개해서 내가 가장 낮으면 0점, 아니면(같은 점수가 있어도) 손패 합에 ${r.stopPenalty}점을 더 받아요.</p>
      <h3>족보</h3><p>6장을 쥐었을 때(선의 첫 패, 또는 한 장 가져온 직후) 아래 조합이면 바로 공개해서 판을 끝낼 수 있어요. 나머지 사람은 손패 합만큼 받아요.</p>
      <table><thead><tr><th>족보</th><th>조건</th><th>점수</th></tr></thead><tbody>
        <tr><td>또이또이</td><td>같은 숫자 3장씩 두 묶음, 또는 2장씩 세 묶음</td><td>0</td></tr>
        <tr><td>스트레이트</td><td>6장이 모두 이어진 숫자 (1–6부터 7–12까지)</td><td>−합<br>(−21~−57)</td></tr>
        <tr><td>10 부족</td><td>합 10 이하</td><td>−100</td></tr>
        <tr><td>60 이상</td><td>합 60 이상</td><td>−100</td></tr>
        <tr><td>총통</td><td>${r.chongtongStrict ? '같은 숫자 4장 + 나머지 2장도 같은 숫자 (4-2)' : '같은 숫자 4장'}</td><td>−100</td></tr>
      </tbody></table>
      <h3>더미가 떨어지면</h3><p>모두 손패 합만큼 점수를 받아요.</p>
      <h3>다음 판</h3><p>이번 판 점수가 가장 낮은 사람이 선을 잡아요.</p>
      <p class="src">규칙은 <a href="https://namu.wiki/w/%EB%82%98%EC%9D%B4%EB%A1%B1%EB%BD%95" target="_blank" rel="noopener">나무위키 ‘나이롱뽕’</a> 문서를 따랐어요. 지역마다 다른 규칙은 새 게임의 ‘지역 규칙’에서 바꿀 수 있어요.</p>
      <div class="sheet-actions"><button class="btn primary" type="button" data-close data-autofocus>닫기</button></div>
    </div>`;
  }
  function showRules() {
    const sh = openSheet(rulesHTML());
    sh.dataset.dismiss = 'yes';
    sh.querySelector('[data-close]').onclick = () => { closeSheet(); resume(); };
  }

  function seg(name, options, value) {
    return `<div class="seg" role="radiogroup">${options.map(([v, label]) => `<label><input type="radio" name="${name}" id="${name}-${v}" value="${v}"${String(v) === String(value) ? ' checked' : ''}><span>${label}</span></label>`).join('')}</div>`;
  }
  function houseRulesHTML(r, open) {
    return `<details class="house"${open ? ' open' : ''}>
        <summary>지역 규칙</summary>
        <p class="note">기본값은 나무위키에 적힌 규칙이에요. 동네마다 다른 규칙으로 바꿀 수 있어요.</p>
        <div class="field"><span class="field-label">스톱할 수 있는 손패 합</span>${seg('stopLimit', [[5, '5 이하'], [10, '10 이하']], r.stopLimit)}</div>
        <div class="field"><span class="field-label">스톱 실패 벌점</span>${seg('stopPenalty', [[30, '+30'], [50, '+50']], r.stopPenalty)}</div>
        <div class="field"><span class="field-label">바가지 점수</span>${seg('bagaji', [[20, '+20'], [30, '+30']], r.bagaji)}</div>
        <div class="field"><span class="field-label">총통 인정</span>${seg('chong', [['any', '4장이면 인정'], ['strict', '4-2만 인정']], r.chongtongStrict ? 'strict' : 'any')}</div>
        <div class="field"><span class="field-label">자연뽕 점수</span>${seg('natural', [['count', '그대로 셈'], ['free', '빼 줌']], r.naturalFree ? 'free' : 'count')}</div>
      </details>`;
  }
  function readRules(sh) {
    const val = (name) => { const i = sh.querySelector(`input[name="${name}"]:checked`); return i ? i.value : null; };
    return { stopLimit: +val('stopLimit'), stopPenalty: +val('stopPenalty'), bagaji: +val('bagaji'), chongtongStrict: val('chong') === 'strict', naturalFree: val('natural') === 'free' };
  }
  function storedSolo() {
    const g = loadStore().game;
    return validGame(g) && g.phase !== 'gameEnd' ? g : null;
  }
  function showStart(notice) {
    const stored = !online && (!G || preview) ? storedSolo() : null;
    const hasGame = !online && ((G && !preview && G.phase !== 'gameEnd') || !!stored);
    const r = S.rules;
    const mode = SERVER ? startMode : 'solo';
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">뽕</span><div><h2 id="sheetTitle">나일롱뽕</h2><p class="lede">화투로 하는 러미 놀이. 손에 남은 패 숫자의 합이 가장 낮은 사람이 이겨요.</p></div></div>
      ${SERVER ? `<div class="field">${seg('mode', [['online', '사람들과'], ['solo', '컴퓨터와']], mode)}</div>` : ''}
      <section data-pane="online"${mode === 'online' ? '' : ' hidden'}>
        <div class="field"><label class="field-label" for="nick">닉네임</label><input class="text-input" id="nick" maxlength="8" autocomplete="nickname" placeholder="예: 주원" value="${esc(myName())}"></div>
        <p class="notice" data-notice${notice ? '' : ' hidden'}>${esc(notice || '')}</p>
        <p class="live" data-live></p>
        <div class="sheet-actions">
          <button class="btn primary" type="button" data-quick>빠른 참가</button>
          <button class="btn" type="button" data-create>친구랑 방 만들기</button>
        </div>
        <div class="field"><label class="field-label" for="roomCode">방 번호로 들어가기</label><div class="join-row"><input class="text-input" id="roomCode" inputmode="numeric" maxlength="6" placeholder="6자리 숫자" autocomplete="off"><button class="btn" type="button" data-join>들어가기</button></div></div>
      </section>
      <section data-pane="solo"${mode === 'solo' ? '' : ' hidden'}>
        <div class="field"><span class="field-label">함께할 컴퓨터</span>${seg('cpu', [[1, '1명'], [2, '2명'], [3, '3명']], S.cpu)}</div>
        <div class="field"><span class="field-label">판 수</span>${seg('rounds', [[3, '3판'], [5, '5판'], [10, '10판']], S.rounds)}</div>
        <div class="field"><span class="field-label">진행 속도</span>${seg('speed', [['normal', '보통'], ['fast', '빠르게']], S.speed)}</div>
        ${houseRulesHTML(r)}
        <div class="sheet-actions">
          ${hasGame ? '<button class="btn" type="button" data-resume>이어서 하기</button>' : ''}
          <button class="btn primary" type="button" data-start>${hasGame ? '새로 시작' : '시작하기'}</button>
        </div>
      </section>
      <div class="sheet-actions" style="margin-top:8px"><button class="btn" type="button" data-rules>규칙 보기</button></div>
    `, { dismiss: hasGame, kind: 'start' });
    const val = (name) => { const i = sh.querySelector(`input[name="${name}"]:checked`); return i ? i.value : null; };
    sh.querySelectorAll('input[name="mode"]').forEach((i) => i.addEventListener('change', () => {
      startMode = val('mode');
      sh.querySelector('[data-pane="online"]').hidden = startMode !== 'online';
      sh.querySelector('[data-pane="solo"]').hidden = startMode !== 'solo';
      saveStore();
    }));
    sh.querySelector('[data-start]').onclick = () => {
      S = cleanSettings({ cpu: +val('cpu'), rounds: +val('rounds'), speed: val('speed'), rules: readRules(sh) });
      Sound.unlock();
      closeSheet();
      newGame();
    };
    const res = sh.querySelector('[data-resume]');
    if (res) res.onclick = () => {
      Sound.unlock();
      if (stored) { G = stored; preview = false; gen += 1; shownFor = null; }
      closeSheet();
      resume();
    };
    sh.querySelector('[data-rules]').onclick = () => {
      const s2 = openSheet(rulesHTML(S.rules), { kind: 'rules' });
      s2.querySelector('[data-close]').textContent = '돌아가기';
      s2.querySelector('[data-close]').onclick = () => showStart();
    };
    if (SERVER) {
      const nick = sh.querySelector('#nick'), code = sh.querySelector('#roomCode');
      const note = (msg) => { const n = sh.querySelector('[data-notice]'); n.textContent = msg; n.hidden = !msg; };
      nick.addEventListener('change', () => setMyName(cleanNick(nick.value)));
      code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); });
      const go = async (kind) => {
        const name = cleanNick(nick.value);
        if (!name) { note('닉네임을 먼저 정해 주세요. 다른 사람에게 이 이름으로 보여요'); nick.focus(); return; }
        if (kind === 'join' && !/^\d{6}$/.test(code.value)) { note('방 번호 6자리를 넣어 주세요'); code.focus(); return; }
        setMyName(name);
        Sound.unlock();
        note('');
        sh.querySelectorAll('[data-quick],[data-create],[data-join]').forEach((b) => { b.disabled = true; });
        const live = sh.querySelector('[data-live]');
        live.textContent = kind === 'quick' ? '같이 할 사람을 찾는 중…' : '방을 여는 중…';
        try {
          let room = code.value;
          if (kind === 'quick') room = (await Net.api('/api/quick')).code;
          if (kind === 'create') room = (await Net.api('/api/rooms', { public: false })).code;
          joinRoom(room, { quick: kind === 'quick' });
        } catch (e) {
          note('서버에 연결하지 못했어요. 잠시 뒤에 다시 해 주세요');
          live.textContent = '';
          sh.querySelectorAll('[data-quick],[data-create],[data-join]').forEach((b) => { b.disabled = false; });
        }
      };
      sh.querySelector('[data-quick]').onclick = () => go('quick');
      sh.querySelector('[data-create]').onclick = () => go('create');
      sh.querySelector('[data-join]').onclick = () => go('join');
      code.addEventListener('keydown', (e) => { if (e.key === 'Enter') go('join'); });
      Net.stats().then((st) => {
        const live = sh.querySelector('[data-live]');
        if (!live || live.textContent || sheetKind !== 'start') return;
        const parts = [];
        if (st.waitingPlayers) parts.push(`지금 기다리는 사람 ${st.waitingPlayers}명`);
        if (st.playingRooms) parts.push(`진행 중인 방 ${st.playingRooms}개`);
        live.textContent = parts.length ? parts.join(' · ') : '빠른 참가를 누르면 먼저 방을 열고 다른 사람을 기다려요';
      }).catch(() => {});
    }
  }

  function tallyHTML(res) {
    const order = [];
    for (let k = 0; k < G.players.length; k++) order.push(k);
    order.sort((a, b) => res.scores[a] - res.scores[b] || a - b);
    return `<ol class="tally">${order.map((i) => {
      const pl = G.players[i];
      const hand = res.hands[i].slice().sort((a, b) => a - b);
      const notes = res.notes[i].map((t) => `<span class="note">${t}</span>`).join(' ');
      const melds = res.melds[i].map((m) => `<span class="meld-tag">뽕 ${M(m[0])}월</span>`).join('');
      const sc = res.scores[i];
      return `<li class="${i === res.best ? 'win' : ''}">
        <div class="who">${avatarHTML(i)}<span class="name">${esc(pl.name)}</span>${notes}</div>
        <div class="cards" data-cards="${hand.join(',')}">${melds}${hand.length ? '' : '<span class="empty-hand">패를 다 털었어요</span>'}</div>
        <div class="num round"><small>이번 판</small>${sc > 0 ? '+' + sc : sc}</div>
        <div class="num total"><small>누적</small>${res.cumulative[i]}</div>
        <div class="sum">손패 합 ${res.totals[i]}</div>
      </li>`;
    }).join('')}</ol>`;
  }
  function fillTallyCards(sh) {
    sh.querySelectorAll('.cards[data-cards]').forEach((box) => {
      const ids = box.dataset.cards ? box.dataset.cards.split(',').map(Number) : [];
      ids.forEach((id) => box.appendChild(makeCard(id)));
    });
  }
  function headline(res) {
    const n = (i) => (i === HUMAN ? '내' : esc(G.players[i].name));
    switch (res.kind) {
      case 'bak': return [res.p === HUMAN ? '박! 패를 다 털었어요' : `${n(res.p)} 박!`,`${res.from === HUMAN ? '내가' : subj(res.from)} 버린 패로 패를 다 털었어요. ${res.from === HUMAN ? '내가' : subj(res.from)} 바가지를 썼어요.`, '박'];
      case 'jayeon': return [`${n(res.p)} 자연바가지!`, `자연뽕을 쥐고 남은 짝으로 뽕해서 바로 이겼어요. ${res.from === HUMAN ? '내가' : subj(res.from)} 바가지를 썼어요.`, '뽕'];
      case 'stop': return res.success
        ? [`${n(res.p)} 스톱 성공`, `손패 합 ${res.totals[res.p]}로 가장 낮아서 0점이에요.`, '止']
        : [`${n(res.p)} 스톱 실패`, `더 낮거나 같은 사람이 있어서 손패 합에 ${G.rules.stopPenalty}점을 더 받아요.`, '止'];
      case 'jokbo': return [`${n(res.p)} 족보 — ${res.jokbo.name}`, `${res.jokbo.all.join(' · ')} → ${res.jokbo.score}점`, '譜'];
      default: return ['더미가 다 떨어졌어요', '모두 손패 합만큼 점수를 받아요.', '終'];
    }
  }
  function showRoundSheet(refresh) {
    if (!G || !G.result || G.phase !== 'roundEnd') return;
    shownFor = resultKey();
    const res = G.result;
    const [title, desc, mark] = headline(res);
    const iWon = res.best === HUMAN;
    if (!refresh) { if (iWon) Sound.win(); else if (res.from === HUMAN || (res.kind === 'stop' && res.p === HUMAN && !res.success)) Sound.lose(); }
    const nextLabel = res.last ? '최종 결과 보기' : `다음 판 (${G.round + 1}/${G.rounds})`;
    let footer;
    if (online && online.room) {
      // 사람들과 할 때: 모두 준비하거나 시간이 다 되면 넘어감
      const need = online.room.seats.filter((s) => s.kind === 'human' && s.online && !s.away);
      const ready = need.filter((s) => s.ready).length;
      const mine = online.room.seats[online.seat];
      footer = `<div class="sheet-actions">
          <button class="btn" type="button" data-scores>점수표</button>
          ${mine && mine.ready
            ? `<button class="btn" type="button" disabled>다른 사람 기다리는 중 ${ready}/${need.length}</button>`
            : `<button class="btn primary" type="button" data-next data-autofocus>${res.last ? '결과 보기' : '다음 판'} <small>준비 ${ready}/${need.length}</small></button>`}
        </div><p class="live"><span class="clock" data-clock></span> 뒤에 자동으로 넘어가요</p>`;
    } else {
      footer = `<div class="sheet-actions">
          <button class="btn" type="button" data-scores>점수표</button>
          <button class="btn primary" type="button" data-next data-autofocus>${nextLabel}</button>
        </div>`;
    }
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">${mark}</span><div><h2 id="sheetTitle">${title}</h2><p class="lede">${G.round}판 · ${desc}</p></div></div>
      ${tallyHTML(res)}
      ${footer}`, { dismiss: true, kind: 'round', noFocus: !!refresh });
    fillTallyCards(sh);
    const nb = sh.querySelector('[data-next]');
    if (nb) nb.onclick = () => {
      if (online) { Net.send({ t: 'ready' }); nb.disabled = true; return; }
      closeSheet();
      act({ type: 'next', p: HUMAN });
    };
    sh.querySelector('[data-scores]').onclick = () => showScores(true);
    tickClock();
  }
  function scoreTableHTML() {
    const P = G.players;
    const kindTag = { bak: '박', jayeon: '자연', stop: '스톱', jokbo: '족보', exhaust: '' };
    const rows = G.history.map((h) => `<tr><td>${h.round}판${kindTag[h.kind] ? ` <span class="tag" style="color:var(--seal)">${kindTag[h.kind]}</span>` : ''}</td>${h.scores.map((s) => `<td>${s}</td>`).join('')}</tr>`).join('');
    return `<div class="scoretable-wrap"><table class="scores"><thead><tr><th>판</th>${P.map((p) => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${P.length + 1}" style="text-align:center;color:#6a6250">아직 끝난 판이 없어요</td></tr>`}</tbody>
      <tfoot><tr><td>합계</td>${P.map((p) => `<td>${p.score}</td>`).join('')}</tr></tfoot></table></div>`;
  }
  function showScores(fromRound) {
    if (!G) return;
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">點</span><div><h2 id="sheetTitle">점수표</h2><p class="lede">${G.rounds}판 중 ${G.history.length}판 끝 · 낮을수록 좋아요</p></div></div>
      ${scoreTableHTML()}
      <div class="sheet-actions"><button class="btn primary" type="button" data-close data-autofocus>${fromRound ? '돌아가기' : '닫기'}</button></div>`, { kind: 'scores' });
    sh.querySelector('[data-close]').onclick = () => { if (fromRound) showRoundSheet(); else { closeSheet(); resume(); } };
  }
  function showGameEnd(refresh) {
    if (!G) return;
    clearTimers();
    const first = shownFor !== endKey();
    shownFor = endKey();
    const st = NP.standings(G);
    const mine = st.find((r) => r.i === HUMAN);
    const title = mine.rank === 1 ? (st.filter((r) => r.rank === 1).length > 1 ? '공동 1등!' : '1등!') : `${mine.rank}등`;
    if (first && !refresh) { if (mine.rank === 1) Sound.win(); else Sound.lose(); }
    const isHost = online && online.room && online.room.host === online.seat;
    const actions = online
      ? `<div class="sheet-actions">
          <button class="btn" type="button" data-leave>나가기</button>
          ${isHost ? '<button class="btn primary" type="button" data-again data-autofocus>한 번 더</button>' : ''}
        </div><p class="live">${isHost ? '‘한 번 더’를 누르면 지금 사람들과 같은 방 대기실로 가요.' : '방장이 ‘한 번 더’를 누르면 같은 방 대기실로 가요.'}</p>`
      : `<div class="sheet-actions">
          <button class="btn" type="button" data-settings>설정 바꾸기</button>
          <button class="btn primary" type="button" data-again data-autofocus>한 번 더</button>
        </div>`;
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">${mine.rank === 1 ? '壹' : '終'}</span><div><h2 id="sheetTitle">${title}</h2><p class="lede">${G.rounds}판을 모두 마쳤어요. 누적 점수가 가장 낮은 사람이 이겨요.</p></div></div>
      <ol class="rank-list">${st.map((r) => `<li class="${r.rank === 1 ? 'first' : ''}"><span class="rk">${r.rank}위</span>${avatarHTML(r.i)}<b>${esc(r.name)}</b><span class="pts">${r.score}점</span></li>`).join('')}</ol>
      ${scoreTableHTML()}
      ${actions}`, { dismiss: false, kind: 'end', noFocus: !!refresh });
    const again = sh.querySelector('[data-again]');
    if (again) again.onclick = () => {
      if (online) { Net.send({ t: 'again' }); again.disabled = true; return; }
      closeSheet();
      newGame();
    };
    const set = sh.querySelector('[data-settings]');
    if (set) set.onclick = () => showStart();
    const lv = sh.querySelector('[data-leave]');
    if (lv) lv.onclick = () => leaveOnline();
  }

  /* ───────── 사람들과 하기 (온라인) ───────── */
  const NAME_KEY = 'nylonppong.name';
  const PID_KEY = 'nylonppong.pid';
  const cleanNick = (s) => Array.from(String(s || '').replace(/[\u0000-\u001f\u007f<>&"']/g, '').replace(/\s+/g, ' ').trim()).slice(0, 8).join('');
  function myName() { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } }
  function setMyName(n) { try { if (n) localStorage.setItem(NAME_KEY, n); } catch (e) { /* 무시 */ } }
  function randomHex(bytes) { const a = new Uint8Array(bytes); crypto.getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); }
  // 다시 들어올 때 같은 자리를 찾는 열쇠 (이 브라우저에만 저장)
  function getPid() {
    try {
      let p = localStorage.getItem(PID_KEY);
      if (!/^[a-f0-9]{32}$/.test(p || '')) { p = randomHex(16); localStorage.setItem(PID_KEY, p); }
      return p;
    } catch (e) { return randomHex(16); }
  }

  const Net = (() => {
    let ws = null, code = null, want = false, tries = 0, gotState = false, ping = null, pid = null, queued = 0;
    let chain = Promise.resolve();
    async function api(path, body) {
      const r = await fetch(SERVER + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error || !j.code) throw new Error(j.error || 'http ' + r.status);
      return j;
    }
    async function stats() { const r = await fetch(SERVER + '/api/stats'); return r.json(); }
    function connect() {
      if (!want || !code) return;
      pid = pid || getPid();
      const url = SERVER.replace(/^http/, 'ws') + `/ws/${code}?pid=${pid}&name=${encodeURIComponent(myName() || '손님')}`;
      let sock;
      try { sock = new WebSocket(url); } catch (e) { retry(); return; }
      ws = sock;
      sock.onopen = () => {
        tries = 0;
        clearInterval(ping);
        ping = setInterval(() => { if (sock.readyState === 1) sock.send('ping'); }, 25000);
      };
      sock.onmessage = (e) => {
        if (e.data === 'pong' || sock !== ws) return;
        let m;
        try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.t === 'state') gotState = true;
        queued++;
        chain = chain.then(() => onNet(m)).catch((err) => console.error(err)).finally(() => { queued = Math.max(0, queued - 1); });
      };
      sock.onclose = () => {
        clearInterval(ping);
        if (sock === ws) { ws = null; retry(); }
      };
    }
    function retry() {
      if (!want) return;
      tries++;
      if (!gotState && tries >= 4) {
        want = false;
        chain = chain.then(() => exitOnline('서버에 연결하지 못했어요. 잠시 뒤에 다시 해 주세요'));
        return;
      }
      if (gotState) say('연결이 끊겼어요. 다시 연결하는 중이에요…');
      setTimeout(connect, Math.min(8000, 400 * 2 ** Math.min(tries, 5)));
    }
    return {
      api, stats,
      get pending() { return queued; },
      open(c) {
        code = c; want = true; tries = 0; gotState = false;
        if (ws) { const old = ws; ws = null; try { old.close(1000); } catch (e) { /* 무시 */ } }
        connect();
      },
      send(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; },
      close() {
        want = false; code = null; clearInterval(ping);
        const s = ws; ws = null;
        if (s) { try { s.close(1000); } catch (e) { /* 무시 */ } }
      },
      wake() { if (want && !ws) { tries = 0; connect(); } },
    };
  })();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Net.wake(); });

  // 서버가 보낸 판을 '내가 0번(아래쪽)'이 되게 돌려서, 혼자 할 때 화면을 그대로 씀
  function rotator(me, n) {
    const R = (i) => (typeof i !== 'number' || i < 0 ? i : (i - me + n) % n);
    const rot = (arr) => (Array.isArray(arr) ? arr.map((_, k) => arr[(k + me) % n]) : arr);
    return { R, rot };
  }
  function rotateResult(res, R, rot) {
    if (!res) return null;
    return {
      ...res, p: R(res.p), from: R(res.from), best: R(res.best), nextDealer: R(res.nextDealer),
      totals: rot(res.totals), scores: rot(res.scores), notes: rot(res.notes), hands: rot(res.hands), melds: rot(res.melds), cumulative: rot(res.cumulative),
    };
  }
  function rotateView(v, me, room) {
    const n = v.players.length;
    const { R, rot } = rotator(me, n);
    const players = rot(v.players).map((p, k) => {
      const abs = (k + me) % n;
      const si = room.seats[abs] || null;
      return {
        name: k === 0 ? '나' : p.name, kind: si && si.kind === 'ai' ? 'ai' : 'human', persona: p.persona,
        hand: Array.isArray(p.hand) ? p.hand.slice() : new Array(p.handCount).fill(-1),
        melds: p.melds, score: p.score, drawsSinceMeld: p.drawsSinceMeld, abs, seatInfo: si,
      };
    });
    let claim = null;
    if (v.claim) claim = v.claim.pending ? { pending: true, from: R(v.claim.from), card: v.claim.card } : { ...v.claim, p: R(v.claim.p), from: R(v.claim.from) };
    return {
      v: 1, online: true, rules: v.rules, rounds: v.rounds, round: v.round, dealer: R(v.dealer), turn: R(v.turn), phase: v.phase, step: v.step,
      claim, deck: new Array(v.deckCount).fill(-1), pile: v.pile.map((e) => ({ ...e, by: R(e.by) })), players,
      result: rotateResult(v.result, R, rot),
      history: (v.history || []).map((h) => ({ ...h, p: R(h.p), scores: rot(h.scores) })),
    };
  }
  function rotateLast(last, me, n) {
    const { R, rot } = rotator(me, n);
    const fix = (o) => { const c = { ...o }; ['p', 'from', 'dealer'].forEach((k) => { if (typeof c[k] === 'number') c[k] = R(c[k]); }); return c; };
    return {
      step: last.step,
      action: fix(last.action),
      events: last.events.map((e) => (e.t === 'roundEnd' ? { ...fix(e), result: rotateResult(e.result, R, rot) } : fix(e))),
    };
  }

  let quickRetries = 0;
  async function onNet(m) {
    if (!online) return;
    if (m.t === 'error') {
      if (m.fatal) {
        if (m.code === 'full' && online.quick && quickRetries < 2) {
          quickRetries++;
          try { const r = await Net.api('/api/quick'); joinRoom(r.code, { quick: true, keepRetries: true }); return; } catch (e) { /* 아래로 */ }
        }
        exitOnline(m.message || '방에 들어가지 못했어요');
        return;
      }
      clearTimeout(actGuard);
      busy = false;
      say(esc(m.message || '그 행동은 지금 할 수 없어요'));
      render();
      return;
    }
    if (m.t !== 'state') return;
    const room = m.room;
    online.room = room;
    online.seat = m.seat;
    online.skew = (m.now || Date.now()) - Date.now();
    if (m.seat < 0) { exitOnline('방에서 내 자리가 없어졌어요'); return; }
    if (room.status === 'waiting' || !m.view) {
      clearTimeout(actGuard);
      busy = false;
      if (!preview) showPreview();
      online.gen = room.gen;
      showWaiting();
      return;
    }
    quickRetries = 0;
    const n = m.view.players.length;
    const next = rotateView(m.view, m.seat, room);
    const last = m.last ? rotateLast(m.last, m.seat, n) : null;
    const fresh = online.gen !== room.gen;
    const sequential = G && !preview && !fresh && last && G.step === m.view.step - 1;
    const dealt = last && last.action.type === 'start' && m.view.step === 0;
    const animate = (sequential || dealt) && Net.pending <= 2 && !document.hidden && T(100) > 0;
    online.gen = room.gen;
    if (fresh) { shownFor = null; selected = null; }
    const newRound = last && (last.action.type === 'next' || last.action.type === 'start');
    if (sheetKind === 'waiting' || sheetKind === 'connecting' || sheetKind === 'invited' ||
      (sheetKind === 'round' && next.phase !== 'roundEnd') || (sheetKind === 'end' && next.phase !== 'gameEnd') ||
      (sheetKind === 'scores' && newRound)) closeSheet();
    clearTimeout(actGuard);
    if (animate) {
      const from = snapshotFrom(last.action, last.events);
      preview = false;
      G = next;
      busy = true;
      try { await present(last.action, last.events, from); } catch (e) { console.error(e); }
      busy = false;
    } else {
      preview = false;
      G = next;
      busy = false;
    }
    if (selected != null && !G.players[HUMAN].hand.includes(selected)) selected = null;
    render();
    onlineAfter();
  }

  function onlineAfter() {
    if (!online || !G || preview) return;
    if (G.phase === 'roundEnd') {
      const key = resultKey();
      if (shownFor !== key) later(() => { if (online && G && G.phase === 'roundEnd' && shownFor !== key && !sheetKind) showRoundSheet(); }, Math.max(500, T(700)));
      else if (sheetKind === 'round') showRoundSheet(true);
      return;
    }
    if (G.phase === 'gameEnd') {
      if (shownFor !== endKey()) showGameEnd(); else if (sheetKind === 'end') showGameEnd(true);
      return;
    }
    if (NP.actorOf(G) === HUMAN && G.phase === 'draw') {
      say(NP.canStop(G, HUMAN) ? '내 차례 — 한 장 가져오거나 <em>스톱</em>할 수 있어요' : '내 차례 — 더미에서 한 장 가져오세요');
    }
  }

  function joinRoom(code, opts = {}) {
    if (!opts.keepRetries) quickRetries = 0;
    online = { code, seat: -1, room: null, skew: 0, gen: -1, quick: !!opts.quick };
    clearTimers();
    busy = false;
    selected = null;
    shownFor = null;
    showPreview();
    try { history.replaceState(null, '', '#' + code); } catch (e) { /* 무시 */ }
    const sh = openSheet(`<div class="sheet-head"><span class="seal-mark" aria-hidden="true">房</span><div><h2 id="sheetTitle">방 ${code.slice(0, 3)} ${code.slice(3)}</h2><p class="lede">들어가는 중이에요…</p></div></div>
      <div class="sheet-actions"><button class="btn" type="button" data-cancel>그만두기</button></div>`, { kind: 'connecting', dismiss: false });
    sh.querySelector('[data-cancel]').onclick = () => leaveOnline();
    Net.open(code);
  }
  function exitOnline(message) {
    Net.close();
    online = null;
    busy = false;
    clearTimeout(actGuard);
    clearTimers();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 무시 */ }
    showPreview();
    showStart(message);
  }
  function leaveOnline() {
    Net.send({ t: 'leave' });
    exitOnline();
  }

  function rulesSummary(r) {
    const d = NP.DEFAULT_RULES, out = [];
    if (r.stopLimit !== d.stopLimit) out.push(`스톱 ${r.stopLimit} 이하`);
    if (r.stopPenalty !== d.stopPenalty) out.push(`스톱 실패 +${r.stopPenalty}`);
    if (r.bagaji !== d.bagaji) out.push(`바가지 +${r.bagaji}`);
    if (r.chongtongStrict) out.push('총통 4-2만');
    if (r.naturalFree) out.push('자연뽕 빼 줌');
    return out.length ? ' · ' + out.join(', ') : '';
  }
  function showWaiting() {
    const r = online && online.room;
    if (!r) return;
    const me = online.seat, isHost = r.host === me, st = r.settings;
    const humans = r.seats.filter((s) => s.kind === 'human').length;
    const list = r.seats.map((s, i) => {
      if (s.kind !== 'human') return '<li><span class="slot" aria-hidden="true"></span><span class="empty">빈자리 · 시작하면 컴퓨터가 앉아요</span></li>';
      const av = `<span class="avatar" style="--av:${i === me ? 'var(--seal)' : AVS[i % AVS.length]}" aria-hidden="true">${esc(Array.from(s.name)[0] || '?')}</span>`;
      return `<li>${av}<span class="who-name">${esc(s.name)}</span>${i === r.host ? '<span class="tag host">방장</span>' : ''}${i === me ? '<span class="tag me">나</span>' : ''}${s.online ? '' : '<span class="tag off">끊김</span>'}</li>`;
    }).join('');
    const settings = isHost
      ? `<div class="field"><span class="field-label">인원</span>${seg('w-max', [[2, '2명'], [3, '3명'], [4, '4명']], st.max)}</div>
        <div class="field"><span class="field-label">판 수</span>${seg('w-rounds', [[3, '3판'], [5, '5판'], [10, '10판']], st.rounds)}</div>
        <div class="field"><span class="field-label">누가 들어올 수 있나요</span>${seg('w-public', [['no', '번호 아는 사람만'], ['yes', '빠른 참가에도 열기']], st.public ? 'yes' : 'no')}</div>
        ${houseRulesHTML(st.rules)}`
      : `<p class="live">${st.max}명 · ${st.rounds}판 · ${st.public ? '공개 방' : '친구 방'}${rulesSummary(st.rules)}</p>`;
    const wasOpen = sheetKind === 'waiting' && !!document.querySelector('#sheet details.house[open]');
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">房</span><div><h2 id="sheetTitle">대기실</h2><p class="lede">${isHost ? '사람이 모이면 시작하세요. 빈자리는 컴퓨터가 채워요.' : '방장이 시작하면 바로 판이 열려요.'}</p></div></div>
      <div class="code-box"><div><span class="code-label">방 번호</span><b class="code">${r.code.slice(0, 3)} ${r.code.slice(3)}</b></div><button class="btn" type="button" data-invite>초대하기</button></div>
      <p class="copied" data-copied></p>
      <ol class="seat-list">${list}</ol>
      ${settings}
      <div class="sheet-actions">
        <button class="btn" type="button" data-leave>나가기</button>
        ${isHost ? '<button class="btn primary" type="button" data-start>시작하기</button>' : ''}
      </div>`, { kind: 'waiting', dismiss: false, noFocus: sheetKind === 'waiting' });
    if (wasOpen) { const d = sh.querySelector('details.house'); if (d) d.open = true; }
    sh.querySelector('[data-invite]').onclick = () => invite(sh);
    sh.querySelector('[data-leave]').onclick = () => leaveOnline();
    const startBtn = sh.querySelector('[data-start]');
    if (startBtn) startBtn.onclick = () => { Sound.unlock(); if (Net.send({ t: 'start' })) startBtn.disabled = true; };
    if (isHost) {
      const val = (name) => { const i = sh.querySelector(`input[name="${name}"]:checked`); return i ? i.value : null; };
      sh.querySelectorAll('input[type="radio"]').forEach((i) => i.addEventListener('change', () => {
        Net.send({ t: 'settings', settings: { max: +val('w-max'), rounds: +val('w-rounds'), public: val('w-public') === 'yes', rules: readRules(sh) } });
      }));
    }
  }

  async function invite(sh) {
    const url = location.origin + location.pathname + '#' + online.code;
    const text = `나일롱뽕 같이 해요! 방 번호 ${online.code}`;
    const note = (t) => { const n = sh && sh.querySelector('[data-copied]'); if (n) n.textContent = t; };
    if (navigator.share) {
      try { await navigator.share({ title: '나일롱뽕', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(`${text}\n${url}`); note('초대 링크를 복사했어요. 카톡 같은 데 붙여 넣으세요'); } catch (e) { note(url); }
  }

  function showOnlineMenu() {
    const r = online.room;
    const playing = r && r.status === 'playing';
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">房</span><div><h2 id="sheetTitle">방 ${online.code.slice(0, 3)} ${online.code.slice(3)}</h2><p class="lede">${playing ? '게임 중에 나가면 내 자리는 컴퓨터가 대신 둬요.' : '사람들과 하는 중이에요.'}</p></div></div>
      <div class="sheet-actions"><button class="btn" type="button" data-invite>친구 초대하기</button><button class="btn" type="button" data-rules>규칙 보기</button></div>
      <p class="copied" data-copied></p>
      <div class="sheet-actions"><button class="btn" type="button" data-leave>방 나가기</button><button class="btn primary" type="button" data-close data-autofocus>돌아가기</button></div>`, { kind: 'menu' });
    sh.querySelector('[data-invite]').onclick = () => invite(sh);
    sh.querySelector('[data-rules]').onclick = () => {
      const s2 = openSheet(rulesHTML(), { kind: 'rules' });
      s2.querySelector('[data-close]').onclick = () => { closeSheet(); resume(); };
    };
    sh.querySelector('[data-leave]').onclick = () => leaveOnline();
    sh.querySelector('[data-close]').onclick = () => { closeSheet(); resume(); };
  }

  function showInvited(code) {
    const sh = openSheet(`
      <div class="sheet-head"><span class="seal-mark" aria-hidden="true">뽕</span><div><h2 id="sheetTitle">나일롱뽕 초대</h2><p class="lede">방 ${code.slice(0, 3)} ${code.slice(3)}에서 같이 하자고 해요.</p></div></div>
      <div class="field"><label class="field-label" for="nick">닉네임</label><input class="text-input" id="nick" maxlength="8" autocomplete="nickname" placeholder="예: 주원" value="${esc(myName())}"></div>
      <p class="notice" data-notice hidden></p>
      <div class="sheet-actions"><button class="btn" type="button" data-solo>혼자 하기</button><button class="btn primary" type="button" data-go>들어가기</button></div>`, { kind: 'invited', dismiss: false });
    const nick = sh.querySelector('#nick');
    const go = () => {
      const name = cleanNick(nick.value);
      if (!name) { const n = sh.querySelector('[data-notice]'); n.textContent = '닉네임을 정해 주세요. 다른 사람에게 이 이름으로 보여요'; n.hidden = false; nick.focus(); return; }
      setMyName(name);
      Sound.unlock();
      joinRoom(code);
    };
    sh.querySelector('[data-go]').onclick = go;
    nick.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    sh.querySelector('[data-solo]').onclick = () => {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 무시 */ }
      startMode = 'solo';
      showStart();
    };
  }

  function tickClock() {
    if (!online || !online.room) return;
    const d = online.room.deadline;
    const left = d ? Math.max(0, Math.ceil((d - (Date.now() + online.skew)) / 1000)) : 0;
    document.querySelectorAll('[data-clock]').forEach((n) => { n.textContent = d ? `${left}초` : ''; });
  }
  setInterval(tickClock, 250);
  window.addEventListener('hashchange', () => {
    const m = /^#(\d{6})$/.exec(location.hash || '');
    if (!m || !SERVER || (online && online.code === m[1])) return;
    if (online) Net.send({ t: 'leave' });
    if (myName()) joinRoom(m[1]); else showInvited(m[1]);
  });

  /* ───────── 시작 ───────── */
  function randomSeed() {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] || 1; } catch (e) { return (Math.random() * 4294967295) >>> 0 || 1; }
  }
  function makeGame(seed) {
    const players = [{ name: ME.name, kind: 'human' }];
    for (let k = 0; k < S.cpu; k++) players.push({ name: CPU[k].name, kind: 'ai', persona: CPU[k].persona });
    return NP.createGame({ players, rounds: S.rounds, rules: S.rules, seed, firstDealer: HUMAN });
  }
  async function newGame() {
    clearTimers();
    gen += 1;
    const g0 = gen;
    busy = true;
    preview = false;
    selected = null;
    shownFor = null;
    G = makeGame(randomSeed());
    saveStore();
    try { await dealAnimation(); } finally { if (gen === g0) busy = false; }
    if (gen !== g0) return;
    render();
    saveStore();
    tick();
  }
  function showPreview() {
    preview = true;
    G = makeGame(20261013);
    render();
    say('');
  }

  $('#btnRules').onclick = showRules;
  $('#btnScores').onclick = () => (G && !preview ? showScores(false) : showRules());
  $('#btnMenu').onclick = () => (online ? showOnlineMenu() : showStart());
  $('#btnSound').onclick = () => {
    Sound.on = !Sound.on;
    $('#btnSound').setAttribute('aria-pressed', String(Sound.on));
    if (Sound.on) { Sound.unlock(); Sound.tak(); }
    saveStore();
  };
  $('#deck').onclick = () => { if (G && !preview && G.phase === 'draw' && G.turn === HUMAN) act({ type: 'draw', p: HUMAN }); };

  function boot(data) {
    buildSprite();
    const store = loadStore();
    S = cleanSettings((data && data.S) || store.settings);
    if (typeof store.sound === 'boolean') Sound.on = store.sound;
    if (data && typeof data.sound === 'boolean') Sound.on = data.sound;
    $('#btnSound').setAttribute('aria-pressed', String(Sound.on));
    if (store.mode === 'solo' || store.mode === 'online') startMode = store.mode;
    // 초대 링크(#방번호)로 들어왔거나, 사람들과 하다가 새로고침한 경우
    const invited = /^#(\d{6})$/.exec(location.hash || '');
    if (invited && SERVER) {
      showPreview();
      if (myName()) joinRoom(invited[1]); else showInvited(invited[1]);
      return;
    }
    const saved = (data && validGame(data.G) && !data.G.online && data.G) || (validGame(store.game) && store.game);
    if (saved && saved.phase !== 'gameEnd') {
      G = saved;
      preview = false;
      render();
      say(lastLine || '이어서 할 수 있어요');
      if (data && data.G) { tick(); return; }
      showStart();
      return;
    }
    showPreview();
    showStart();
  }

  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ G: preview || online ? null : G, S, sound: Sound.on })); } catch (e) { /* 미리보기 밖 */ }
  }
  // 자동 테스트용 손잡이
  window.__nylon = { get G() { return G; }, act, get busy() { return busy; }, newGame, setSpeed(v) { S.speed = v; }, get online() { return online; }, get sheet() { return sheetKind; } };

  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
